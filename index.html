<html lang="es">

<meta name="mobile-web-app-capable" content="yes">

<title>Vida</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:#F1ECEA;background-image:var(--page);background-attachment:fixed;background-repeat:no-repeat;min-height:100vh}

button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:active{transform:scale(.97)}
input,select{font:500 14px 'Poppins',system-ui;width:100%;background:var(--pill);border:1px solid var(--rim);color:var(--text);border-radius:16px;padding:12px 14px;margin:4px 0;box-shadow:var(--pill-shadow)}
select option{color:#222}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--glass-hi),var(--glass));border:var(--rim-w) solid var(--rim);box-shadow:var(--shadow);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .5s both}
.lab{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--faint);cursor:pointer}
.rows .row:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:12px;background:var(--faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-text)}
.rt{flex:1;min-width:0}.rt .n{font-size:16px;font-weight:600;line-height:1.25}.rt .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.bar{height:6px;border-radius:3px;background:var(--faint);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;font:500 13px 'Poppins',system-ui;border:1px solid var(--rim);background:var(--pill);color:var(--text);box-shadow:var(--pill-shadow);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn{min-height:40px;padding:0 16px;border-radius:999px;font:500 14px 'Poppins',system-ui;border:1px solid var(--rim);background:var(--pill);color:var(--text);box-shadow:var(--pill-shadow)}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.w{color:var(--bad)}
.btn.f{width:100%}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--rim);background:var(--pill);box-shadow:var(--pill-shadow);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.circ.s{width:34px;height:34px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:var(--rim-w) solid var(--rim);border-radius:28px;padding:14px;color:var(--tile-text);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-height:118px;text-align:left;box-shadow:var(--shadow);animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}

.tile .i{position:absolute;top:12px;right:12px;opacity:.85}

.dock button.on{color:var(--accent-text)}
.hdr{display:flex;align-items:center;gap:14px}
.hdr .tt{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.15}.hdr .ss{font-size:13px;color:var(--muted)}

.cell{display:flex;flex-direction:column;align-items:center;gap:2px}

.cell .num{font-size:11px;color:var(--muted)}.cell.today .num{color:var(--accent-text);font-weight:700}
.cell.sel .egg{outline:2px solid var(--text);outline-offset:1px}
.cnt{display:flex;gap:16px;flex-wrap:wrap}.cnt span{display:flex;align-items:center;gap:6px;font-size:14px}
.mini{width:14px;height:16px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;display:inline-block}
.pick{display:flex;gap:8px}
.pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--pill);border:1px solid var(--rim);box-shadow:var(--pill-shadow);border-radius:20px;padding:10px 4px;font-size:11px}
.cd{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.sheet{width:100%;max-width:520px;background:var(--base);border-radius:30px 30px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.sheet label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-top:8px}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
.empty{font-size:13px;color:var(--muted);padding:4px 0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0}.chk.d{background:var(--ok);border-color:var(--ok)}
.done .n{text-decoration:line-through;color:var(--muted)}
.mapw{position:relative;width:100%;margin:0 auto;overflow:hidden;border-radius:20px}
.hint{font-size:12.5px;color:var(--muted)}

// ---------- WebSocket
function send(o,cb){var i=S.id++;o.id=i;if(cb)S.pend[i]=cb;S.ws.send(JSON.stringify(o));return i}
function connect(){
  if(!S.tok){render();return}
  var u=S.base.replace(/^http/,'ws')+'/api/websocket';
  try{S.ws=new WebSocket(u)}catch(e){setStatus('error','al');return}
  S.ws.onmessage=function(m){var d=JSON.parse(m.data);
    if(d.type==='auth_required')S.ws.send(JSON.stringify({type:'auth',access_token:S.tok}));
    else if(d.type==='auth_invalid'){setStatus('token inválido','al');S.tok='';localStorage.removeItem('vida-token');render()}
    else if(d.type==='auth_ok'){S.ready=true;setStatus('conectado','on');boot()}
    else if(d.type==='result'){var cb=S.pend[d.id];delete S.pend[d.id];if(cb)cb(d)}
    else if(d.type==='event'&&d.event&&d.event.event_type==='state_changed'){var n=d.event.data.new_state;if(n){S.states[n.entity_id]=n;if(n.entity_id.indexOf('todo.')===0)loadTodo();softRender()}}
  };
  S.ws.onclose=function(){S.ready=false;setStatus('reconectando','al');setTimeout(connect,4000)};
  S.ws.onerror=function(){setStatus('sin conexión','al')};
}
function boot(){
  send({type:'get_states'},function(r){(r.result||[]).forEach(function(e){S.states[e.entity_id]=e});render();loadTodo();loadEvents()});
  send({type:'subscribe_events',event_type:'state_changed'});
  send({type:'frontend/get_user_data',key:'vida_bitacora'},function(r){var v=r.result&&r.result.value;S.dl=(v&&v.dl)?v.dl:{};if(!(v&&v.dl))saveDl();render()});
  send({type:'frontend/get_user_data',key:'vida_data'},function(r){var v=r.result&&r.result.value;
    if(v){S.D={items:v.items||[],hid:v.hid||{},pin:v.pin||'',hidInit:v.hidInit,map:v.map||{},furn:v.furn||[],closet:v.closet||[],equip:v.equip||[]}}
    S.dataLoaded=true;initHid();render()});
}

function loadEvents(){
  var cals=Object.keys(S.states).filter(function(k){return k.indexOf('calendar.')===0});
  if(!cals.length){setTimeout(function(){if(S.ready)loadEvents()},2500);return}
  S.cals=cals.map(function(c,i){return{id:c,n:nm(S.states[c]),c:CALCOL[i%CALCOL.length]}});

    .then(function(r){return r.json()}).then(function(l){(l||[]).forEach(function(e){var st=e.start.dateTime||e.start.date;all.push({t:e.summary,s:st,day:!!e.start.date,c:c})})}).catch(function(){}).then(function(){if(--left===0){all.sort(function(x,y){return x.s<y.s?-1:1});S.evs=all;softRender()}})

  q('[data-mmove]',function(b){b.onclick=function(){S.mmove=b.dataset.mmove;render()}});
  q('[data-mcancel]',function(b){b.onclick=function(){S.mmove='';render()}});
  q('[data-fe]',function(b){b.onclick=function(){S.fe=!S.fe;S.msel='';S.mmove='';S.fr=null;S.fsel='';render()}});
  q('[data-fadd]',function(b){b.onclick=function(){var c=FCAT[parseInt(b.dataset.fadd,10)],id='f'+Date.now();S.D.furn.push({id:id,f:S.mf,r:S.fr,n:c[0],w:c[1],d:c[2],h:c[3],dx:0,dy:0,c:c[4]});S.fsel=id;saveD();render()}});
  q('[data-fsel]',function(b){b.onclick=function(){S.fsel=b.dataset.fsel;render()}});
  q('[data-fact]',function(b){b.onclick=function(){var p=b.dataset.fact.split(':'),k=p[0],dl=parseFloat(p[1]),f=S.D.furn.filter(function(z){return z.id===S.fsel})[0];if(!f)return;f[k]=Math.round((f[k]+dl)*100)/100;if(k==='w'||k==='d')f[k]=Math.max(.1,f[k]);if(k==='h')f[k]=Math.max(.02,f[k]);saveD();render()}});
  q('[data-fdel]',function(b){b.onclick=function(){S.D.furn=S.D.furn.filter(function(z){return z.id!==S.fsel});S.fsel='';saveD();render()}});
  q('[data-th]',function(b){b.onclick=function(){applyTheme(b.dataset.th);render()}});
  q('[data-cl]',function(b){b.onclick=function(){var it=S.D.closet.filter(function(x){return x.id===b.dataset.cl})[0];if(it)openCloset(JSON.parse(JSON.stringify(it)))}});
  q('[data-cladd]',function(b){b.onclick=function(){openCloset()}});
  q('[data-eq]',function(b){b.onclick=function(){var it=S.D.equip.filter(function(x){return x.id===b.dataset.eq})[0];if(it)openEquip(JSON.parse(JSON.stringify(it)))}});
  q('[data-eqadd]',function(b){b.onclick=function(){openEquip()}});
  var lo=$('#logout');if(lo)lo.onclick=function(){if(confirm('¿Desconectar este dispositivo?')){localStorage.removeItem('vida-token');location.reload()}};
}
applyTheme(theme);
setInterval(function(){if(S.scr==='home'&&S.tok)softRender()},30000);
render();connect();
})();
</script>
</body>
</html>
