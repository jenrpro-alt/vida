<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14111a">
<meta name="mobile-web-app-capable" content="yes">
<title>Vida</title>
<style>
:root{--bg:#14111a;--glass:rgba(255,255,255,.07);--glass-hi:rgba(255,255,255,.12);--faint:rgba(255,255,255,.09);--ink:#f3eef8;--dim:#a79fb4;--acc:#f28b1e;--ok:#5ad19a;--bad:#ff6b6b;--warn:#ffc44d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,#3a2450 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#2a3a58 0,transparent 55%),var(--bg);padding:env(safe-area-inset-top) 0 96px}
main{max-width:560px;margin:0 auto;padding:16px 16px 0}
h1{font-size:22px;font-weight:600;margin:6px 0 2px}
.sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.card{background:var(--glass);border:1px solid var(--faint);border-radius:24px;padding:14px;margin-bottom:12px;backdrop-filter:blur(14px)}
.card h2{font-size:13px;font-weight:500;color:var(--dim);margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--faint);cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .n{font-size:14px}.row .s{font-size:11.5px;color:var(--dim)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--glass-hi);border-radius:14px;padding:9px 14px;font-size:13px}
.btn.p{background:var(--acc);color:#1d1a22;font-weight:600}
.btn.w{background:rgba(255,107,107,.18);color:#ffb1b1}
.sw{width:46px;height:27px;border-radius:14px;background:var(--faint);position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex-shrink:0}.dot.on{background:var(--ok)}.dot.al{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(20,17,26,.88);backdrop-filter:blur(16px);border-top:1px solid var(--faint);z-index:6}
nav button{flex:1;max-width:110px;padding:10px 4px;border-radius:16px;background:transparent;color:var(--dim);font-size:12.5px}
nav button.on{background:var(--glass-hi);color:var(--ink)}
input,select{font:inherit;width:100%;background:var(--glass);border:1px solid var(--faint);color:var(--ink);border-radius:14px;padding:11px 12px;margin:5px 0}
select option{color:#000}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--dim);padding:4px 0}
.cell{background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.cell .egg{width:36px;height:40px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;display:flex;align-items:center;justify-content:center;background:var(--faint)}
.cell .num{font-size:10.5px;color:var(--dim)}.cell.today .num{color:var(--acc);font-weight:700}
.cell.sel .egg{outline:2px solid var(--ink)}
.cnt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.cnt span{display:flex;align-items:center;gap:6px;font-size:13px}
.mini{width:14px;height:16px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.hd b{font-weight:500;font-size:15px;text-transform:capitalize}
.pick{display:flex;gap:8px;margin-top:10px}
.pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--glass);border-radius:18px;padding:10px 4px;font-size:11px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--faint)}.stat span:first-child{color:var(--dim)}
.status{position:fixed;top:8px;right:12px;font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center;z-index:5}
.big{font-size:34px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--glass);border:1px solid var(--faint);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.chip.on{color:var(--ink);background:var(--glass-hi)}
.cd{width:8px;height:8px;border-radius:50%}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--faint);color:var(--dim);white-space:nowrap}
.badge.warn{background:rgba(255,196,77,.18);color:var(--warn)}.badge.bad{background:rgba(255,107,107,.2);color:#ffb1b1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:#1e1a27;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet label{font-size:11.5px;color:var(--dim);display:block;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:12px}
.empty{font-size:12.5px;color:var(--dim);padding:6px 0}
.fab{width:100%;margin-top:8px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex-shrink:0}.chk.d{background:var(--ok);border-color:var(--ok)}
.done .n{text-decoration:line-through;color:var(--dim)}
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="stx">conectando</span></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="md"></div>
<script>
(function(){
'use strict';
var BC={o:'#4aa3d8',c:'#f28b1e',f:'#8e5aa8'},LB={o:'Oficina',c:'Casa',f:'Finde trabajado'};
var BIT0={};
var FACE={
o:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="8.6" cy="9.4" r="1.25" fill="#1d1a22"/><circle cx="15.4" cy="9.4" r="1.25" fill="#1d1a22"/><rect x="6.6" y="13" width="10.8" height="5" rx="2" fill="rgba(255,255,255,.92)" stroke="#1d1a22" stroke-width="1.2"/><path d="M10.2 13v5M13.8 13v5M6.6 15.5h10.8" stroke="#1d1a22" stroke-width=".8" opacity=".7"/></svg>',
c:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.8 8.2h7.4v2.4a3.7 3.7 0 0 1-7.4 0zM12.8 8.2h7.4v2.4a3.7 3.7 0 0 1-7.4 0z" fill="#1d1a22"/><path d="M11.2 8.6h1.6" stroke="#1d1a22" stroke-width="1.3" stroke-linecap="round"/><path d="M9.2 15.6c1.5 1.5 4.1 1.5 5.6 0" stroke="#1d1a22" stroke-width="1.6" stroke-linecap="round"/></svg>',
f:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6.6 7.6l3 3M9.6 7.6l-3 3M14.4 7.6l3 3M17.4 7.6l-3 3" stroke="#1d1a22" stroke-width="1.6" stroke-linecap="round"/><rect x="9.6" y="14" width="4.8" height="4.2" rx="1.4" fill="#1d1a22"/></svg>'};
function egg(v){return v?'background:linear-gradient(165deg,color-mix(in srgb,'+BC[v]+' 78%,white),'+BC[v]+')':''}
var $=function(s){return document.querySelector(s)};
var CALCOL=['#4aa3d8','#f28b1e','#8e5aa8','#5ad19a','#ff6b9a','#ffc44d'];
var CATS={sub:{n:'Suscripciones',p:['Netflix','Spotify','iCloud','YouTube Premium','Prueba gratis'],ev:30},moto:{n:'Moto',p:['SOAT','Tecnomecánica','Impuesto','Cambio de aceite','Kit de arrastre'],ev:365},barb:{n:'Barbero',p:['Corte con Miguel'],ev:21},aseo:{n:'Aseo y basura',p:['Sacar la basura','Aseo general','Cambiar sábanas','Limpiar cocina'],ev:7},med:{n:'Médico',p:['Cita médica','Medicamento','Examen'],ev:0}};
var REP=[[0,'No se repite'],[7,'Cada semana'],[14,'Cada 2 semanas'],[21,'Cada 3 semanas'],[30,'Cada mes'],[90,'Cada 3 meses'],[180,'Cada 6 meses'],[365,'Cada año']];
var S={tab:'hoy',gs:'sub',states:{},dl:null,D:{items:[],hid:{},pin:''},cm:0,sel:'',evs:[],cals:[],todo:[],ws:null,id:1,pend:{},ready:false,unlocked:false,modal:null,
  base:localStorage.getItem('vida-base')||location.origin,tok:localStorage.getItem('vida-token')||''};
if(location.protocol==='file:')S.base='http://192.168.1.20';
function pad(n){return(n<10?'0':'')+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nm(e){return((e.attributes&&e.attributes.friendly_name)||e.entity_id)}
function find(re,doms){var out=[];for(var k in S.states){var e=S.states[k];if(doms&&doms.indexOf(k.split('.')[0])<0)continue;if(re.test(nm(e))||re.test(k))out.push(e)}return out}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function setStatus(t,c){$('#stx').textContent=t;$('#dot').className='dot '+(c||'')}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function dleft(s){return Math.round((new Date(s+'T00:00')-today())/864e5)}
function addDays(s,n){var d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return key(d)}
// ---------- WebSocket ----------
function send(o,cb){var i=S.id++;o.id=i;if(cb)S.pend[i]=cb;S.ws.send(JSON.stringify(o));return i}
function connect(){
  if(!S.tok){render();return}
  var u=S.base.replace(/^http/,'ws')+'/api/websocket';
  try{S.ws=new WebSocket(u)}catch(e){setStatus('error','al');return}
  S.ws.onmessage=function(m){var d=JSON.parse(m.data);
    if(d.type==='auth_required')S.ws.send(JSON.stringify({type:'auth',access_token:S.tok}));
    else if(d.type==='auth_invalid'){setStatus('token inválido','al');S.tok='';localStorage.removeItem('vida-token');render()}
    else if(d.type==='auth_ok'){S.ready=true;setStatus('conectado','on');boot()}
    else if(d.type==='result'){var cb=S.pend[d.id];delete S.pend[d.id];if(cb)cb(d)}
    else if(d.type==='event'&&d.event&&d.event.event_type==='state_changed'){var n=d.event.data.new_state;if(n){S.states[n.entity_id]=n;if(n.entity_id.indexOf('todo.')===0)loadTodo();softRender()}}
  };
  S.ws.onclose=function(){S.ready=false;setStatus('reconectando','al');setTimeout(connect,4000)};
  S.ws.onerror=function(){setStatus('sin conexión','al')};
}
function boot(){
  send({type:'get_states'},function(r){(r.result||[]).forEach(function(e){S.states[e.entity_id]=e});render();loadTodo();loadEvents()});
  send({type:'subscribe_events',event_type:'state_changed'});
  send({type:'frontend/get_user_data',key:'vida_bitacora'},function(r){
    var v=r.result&&r.result.value;
    S.dl=(v&&v.dl)?v.dl:JSON.parse(JSON.stringify(BIT0));if(!(v&&v.dl))saveDl();render()});
  send({type:'frontend/get_user_data',key:'vida_data'},function(r){
    var v=r.result&&r.result.value;if(v){S.D={items:v.items||[],hid:v.hid||{},pin:v.pin||'',hidInit:v.hidInit}}S.dataLoaded=true;initHid();render()});
}
function saveDl(){if(S.ready)send({type:'frontend/set_user_data',key:'vida_bitacora',value:{dl:S.dl}})}
function saveD(){if(S.ready&&S.dataLoaded)send({type:'frontend/set_user_data',key:'vida_data',value:S.D})}
function call(dom,svc,data,target){var o={type:'call_service',domain:dom,service:svc,service_data:data||{}};if(target)o.target=target;send(o)}
function loadEvents(){
  var cals=Object.keys(S.states).filter(function(k){return k.indexOf('calendar.')===0});
  if(!cals.length){setTimeout(function(){if(S.ready)loadEvents()},2500);return}
  S.cals=cals.map(function(c,i){return{id:c,n:nm(S.states[c]),c:CALCOL[i%CALCOL.length]}});
  initHid();
  var a=today(),b=new Date(a.getTime()+8*864e5),all=[],left=cals.length;
  cals.forEach(function(c,i){
    fetch(S.base+'/api/calendars/'+c+'?start='+encodeURIComponent(a.toISOString())+'&end='+encodeURIComponent(b.toISOString()),{headers:{Authorization:'Bearer '+S.tok}})
    .then(function(r){return r.json()}).then(function(l){
      (l||[]).forEach(function(e){var st=e.start.dateTime||e.start.date;all.push({t:e.summary,s:st,day:!!e.start.date,c:c})})
    }).catch(function(){}).then(function(){if(--left===0){all.sort(function(x,y){return x.s<y.s?-1:1});S.evs=all;softRender()}})
  });
}
function initHid(){if(!S.dataLoaded||!S.cals.length||S.D.hidInit)return;S.cals.forEach(function(c){if(/holidays in|d[ií]as feriados|cumplea/i.test(c.n))S.D.hid[c.id]=1});S.D.hidInit=1;saveD()}
function todoEnt(){var t=find(/lista de la compra|shopping/i,['todo'])[0];return t&&t.entity_id}
function loadTodo(){var e=todoEnt();if(!e||!S.ready)return;send({type:'todo/item/list',entity_id:e},function(r){S.todo=(r.result&&r.result.items)||[];softRender()})}
// ---------- Render ----------
var raf=0;function softRender(){if(raf)return;raf=setTimeout(function(){raf=0;var a=document.activeElement;if(S.modal||(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')))return;render()},150)}
function render(){
  var app=$('#app');
  if(!S.tok){app.innerHTML=setupHTML();$('#nav').innerHTML='';
    $('#go').onclick=function(){S.base=$('#base').value.replace(/\/$/,'');S.tok=$('#tok').value.trim();localStorage.setItem('vida-base',S.base);localStorage.setItem('vida-token',S.tok);connect()};return}
  var T=[['hoy','Hoy'],['casa','Casa'],['bartolo','Bartolo'],['listas','Compras'],['gest','Gestión']];
  $('#nav').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){S.tab=b.dataset.t;S.modal=null;$('#md').innerHTML='';render()}});
  app.innerHTML=S.tab==='hoy'?hoyHTML():S.tab==='casa'?casaHTML():S.tab==='bartolo'?bartoloHTML():S.tab==='listas'?listasHTML():gestHTML();
  bind();
}
function setupHTML(){return '<h1>Vida</h1><div class="sub">Conectar con Home Assistant</div><div class="card"><div style="font-size:12px;color:var(--dim)">Dirección del hub</div><input id="base" value="'+S.base+'"><div style="font-size:12px;color:var(--dim);margin-top:8px">Token de acceso de larga duración (HA &gt; tu perfil &gt; Seguridad)</div><input id="tok" placeholder="pega el token aquí" autocomplete="off"><button class="btn p" id="go" style="margin-top:8px;width:100%">Conectar</button></div>'}
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function itemBadge(it){var d=dleft(it.date);var al=it.al==null?7:it.al;var cls=d<0?'bad':d<=al?'warn':'';var t=d<0?'Vencido hace '+(-d)+' d':d===0?'Hoy':d===1?'Mañana':'En '+d+' d';return '<span class="badge '+cls+'">'+t+'</span>'}
function alerts(){var out=[];S.D.items.forEach(function(it){if(it.cat==='med')return;if(!it.date)return;var al=it.al==null?7:it.al;if(dleft(it.date)<=al)out.push(it)});
  out.sort(function(a,b){return a.date<b.date?-1:1});return out}
function hoyHTML(){
  var now=new Date(),vd=new Date(now.getFullYear(),now.getMonth()+S.cm,1),dl=S.dl||{},tk=key(now);
  var lead=vd.getDay(),dim=new Date(vd.getFullYear(),vd.getMonth()+1,0).getDate(),h='';
  ['D','L','M','M','J','V','S'].forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  for(var i=0;i<lead;i++)h+='<div></div>';
  var cnt={o:0,c:0,f:0};
  for(var d=1;d<=dim;d++){var k=vd.getFullYear()+'-'+pad(vd.getMonth()+1)+'-'+pad(d),v=dl[k];if(v)cnt[v]++;
    h+='<button class="cell'+(k===tk?' today':'')+(k===S.sel?' sel':'')+'" data-d="'+k+'"><span class="egg" style="'+egg(v)+'">'+(v?FACE[v]:'<span style="color:var(--dim);font-size:18px">+</span>')+'</span><span class="num">'+d+'</span></button>'}
  var pick='';
  if(S.sel){pick='<div class="pick">'+['o','c','f'].map(function(v){return '<button data-v="'+v+'"><span style="'+egg(v)+';width:38px;height:42px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;display:flex;align-items:center;justify-content:center">'+FACE[v]+'</span>'+LB[v]+'</button>'}).join('')+'<button data-v="x"><span style="width:38px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px">✕</span>Borrar</button></div>'}
  var al=alerts(),ah='';
  var bv=find(/bartolo/i,['vacuum'])[0];
  find(/bartolo.*vida [uú]til/i,['sensor']).forEach(function(e){if(parseFloat(e.state)===0)al.push({name:nm(e).replace(/^bartolo\s*/i,'')+' · reemplazar',cat:'bartolo',nodate:1})});
  if(al.length)ah='<div class="card"><h2>Alertas</h2>'+al.slice(0,6).map(function(it){return '<div class="row" data-go="'+(it.cat==='bartolo'?'bartolo':'gest')+'" data-cat="'+it.cat+'"><div class="t"><div class="n">'+esc(it.name)+'</div><div class="s">'+(it.nodate?'Bartolo':CATS[it.cat].n+(it.where?' · '+esc(it.where):''))+'</div></div>'+(it.nodate?'<span class="badge bad">Revisar</span>':itemBadge(it))+'</div>'}).join('')+'</div>';
  var chips=S.cals.length?'<div class="chips">'+S.cals.map(function(c){return '<button class="chip'+(S.D.hid[c.id]?'':' on')+'" data-cal="'+c.id+'"><i class="cd" style="background:'+c.c+'"></i>'+esc(c.n.length>22?c.n.slice(0,22)+'…':c.n)+'</button>'}).join('')+'</div>':'';
  var seen={},tk0=tk;
  var ev=S.evs.filter(function(e){if(S.D.hid[e.c])return false;var k=e.t+'|'+e.s.slice(0,10);if(seen[k])return false;seen[k]=1;return true}).slice(0,10).map(function(e){var d=new Date(e.s.length>10?e.s:e.s+'T00:00');var lab=key(d)===tk0?'Hoy':d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric'});var hr=e.day?'':d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});var cc=(S.cals.filter(function(c){return c.id===e.c})[0]||{}).c||'#888';
    return '<div class="row" style="cursor:default"><i class="cd" style="background:'+cc+'"></i><div class="t"><div class="n">'+esc(e.t)+'</div><div class="s">'+lab+(hr?' · '+hr:'')+'</div></div></div>'}).join('')||'<div class="empty">Sin eventos próximos</div>';
  return '<h1>Hoy</h1><div class="sub">'+now.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})+'</div>'+ah+
  '<div class="card"><div class="hd"><button class="btn" id="pv">‹</button><b>'+MES[vd.getMonth()]+' '+vd.getFullYear()+'</b><button class="btn" id="nx">›</button></div><div class="cal">'+h+'</div>'+pick+
  '<div class="cnt">'+['o','c','f'].map(function(v){return '<span><i class="mini" style="'+egg(v)+'"></i>'+cnt[v]+'</span>'}).join('')+'</div></div>'+
  '<div class="card"><h2>Próximos eventos</h2>'+chips+ev+'</div>'
}
function isOn(e){return e&&e.state==='on'}
function devRow(e,label){var un=e.state==='unavailable';
  return '<div class="row" style="cursor:default"><span class="dot '+(un?'al':isOn(e)?'on':'')+'"></span><div class="t"><div class="n">'+esc(label||nm(e))+'</div><div class="s">'+(un?'No disponible':isOn(e)?'Encendido':'Apagado')+'</div></div><button class="sw '+(isOn(e)?'on':'')+'" data-tg="'+e.entity_id+'" '+(un?'disabled style="opacity:.4"':'')+'></button></div>'}
function casaHTML(){
  var h='<h1>Casa</h1><div class="sub">Dispositivos del hub</div>';
  var on=find(/Energ[ií]a PC.*ON/i,['scene','script','button']),off=find(/Energ[ií]a PC.*OFF/i,['scene','script','button']);
  var w1=find(/work\s?station\s?1/i,['switch']),w2=find(/work\s?station\s?2/i,['switch']);
  h+='<div class="card"><h2>Estación de trabajo</h2>';
  if(w1[0]&&w2[0]){h+='<div class="row" style="cursor:default"><div class="t"><div class="n">Torre</div><div class="s">'+(isOn(w1[0])?'Encendida':'Apagada')+'</div></div></div><div class="row" style="cursor:default"><div class="t"><div class="n">Pantallas y accesorios</div><div class="s">'+(isOn(w2[0])?'Encendidas':'Apagadas')+'</div></div></div>'}
  h+='<div style="display:flex;gap:8px;margin-top:10px">'+(on[0]?'<button class="btn p" style="flex:1" data-sc="'+on[0].entity_id+'">Encender estación</button>':'')+(off[0]?'<button class="btn w" style="flex:1" data-sc="'+off[0].entity_id+'" data-conf="1">Apagar estación</button>':'')+'</div>'+
  '<div style="font-size:11.5px;color:var(--dim);margin-top:8px">Apagar corta primero las pantallas y la torre tras 1 min. Cierra Windows antes.</div></div>';
  var plugs=find(/Estaci[oó]n de carga|Ventilador/i,['switch','light']);
  h+='<div class="card"><h2>Enchufes</h2>'+(plugs.map(function(e){return devRow(e)}).join('')||'<div class="empty">Sin enchufes</div>')+'</div>';
  var lights=find(/^Luz/i,['switch','light']);
  h+='<div class="card"><h2>Luces</h2>'+(lights.map(function(e){return devRow(e)}).join('')||'<div class="empty">Sin luces</div>')+'</div>';
  var pu=find(/Puerta balc[oó]n/i,['binary_sensor']),bt=find(/Puerta balc[oó]n.*bater/i,['sensor']);
  h+='<div class="card"><h2>Puerta balcón</h2>'+(pu[0]?'<div class="row" style="cursor:default"><span class="dot '+(pu[0].state==='unavailable'?'al':pu[0].state==='on'?'on':'')+'"></span><div class="t"><div class="n">'+(pu[0].state==='on'?'Abierta':pu[0].state==='off'?'Cerrada':'No disponible')+'</div>'+(bt[0]&&!isNaN(parseFloat(bt[0].state))?'<div class="s">Batería '+esc(bt[0].state)+'%</div>':'<div class="s">Revisa la pila o el Wi-Fi del sensor</div>')+'</div></div>':'<div class="empty">Sin sensor</div>')+'</div>';
  return h;
}
function bartoloHTML(){
  var v=find(/bartolo/i,['vacuum'])[0],h='<h1>Bartolo</h1><div class="sub">BPMIO B12</div>';
  if(!v)return h+'<div class="card">No encontré la aspiradora en HA.</div>';
  var A=v.attributes||{},bat=find(/bartolo.*bater|bater.*bartolo/i,['sensor'])[0];
  var stMap={cleaning:'Limpiando',docked:'En la base',returning:'Volviendo',paused:'En pausa',idle:'Inactivo',error:'Error',unavailable:'No disponible'};
  h+='<div class="card"><div class="big">'+(stMap[v.state]||v.state)+'</div><div style="color:var(--dim);font-size:12px">Batería '+(A.battery_level!=null?A.battery_level:bat?bat.state:'—')+'%</div>'+
  '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn p" style="flex:1" data-vc="start">Limpiar</button><button class="btn" style="flex:1" data-vc="pause">Pausa</button><button class="btn" style="flex:1" data-vc="return_to_base">Base</button></div>'+
  '<div style="margin-top:8px"><button class="btn" data-vc="locate" style="width:100%">Localizar</button></div></div>';
  var st=find(/bartolo|tiempo|veces|vida [uú]til|[aá]rea/i,['sensor']).filter(function(e){return e.state!=='unavailable'});
  h+='<div class="card"><h2>Estado</h2>'+(st.map(function(e){var u=(e.attributes&&e.attributes.unit_of_measurement)||'';var n=parseFloat(e.state),val=isNaN(n)?e.state:(Math.round(n*10)/10).toLocaleString('es-CO'),low=/vida [uú]til/i.test(nm(e))&&n===0;return '<div class="stat"><span>'+esc(nm(e).replace(/^bartolo\s*/i,''))+'</span><span'+(low?' style="color:var(--bad)"':'')+'>'+esc(val)+' '+u+(low?' · reemplazar':'')+'</span></div>'}).join('')||'<div class="empty">Sin datos</div>')+'</div>';
  return h;
}
function listasHTML(){
  var e=todoEnt(),h='<h1>Compras</h1><div class="sub">Lista de reposición</div>';
  if(!e)return h+'<div class="card"><div class="empty">No encontré la "Lista de la compra" en HA.</div></div>';
  var pend=S.todo.filter(function(i){return i.status!=='completed'}),done=S.todo.filter(function(i){return i.status==='completed'});
  h+='<div class="card"><div style="display:flex;gap:8px"><input id="ti" placeholder="Agregar a la lista" style="margin:0"><button class="btn p" id="ta">+</button></div></div>';
  h+='<div class="card"><h2>Por comprar ('+pend.length+')</h2>'+(pend.map(function(i){return '<div class="row" data-ti="'+esc(i.uid||i.summary)+'"><span class="chk"></span><div class="t"><div class="n">'+esc(i.summary)+'</div></div></div>'}).join('')||'<div class="empty">Todo al día</div>')+'</div>';
  if(done.length)h+='<div class="card"><h2>Comprado</h2>'+done.map(function(i){return '<div class="row done" data-ti="'+esc(i.uid||i.summary)+'"><span class="chk d"></span><div class="t"><div class="n">'+esc(i.summary)+'</div></div></div>'}).join('')+'<button class="btn w fab" id="tc">Limpiar comprados</button></div>';
  return h;
}
function lockHTML(){return '<div class="card"><h2>Médico</h2><div class="empty">'+(S.D.pin?'Ingresa tu PIN para ver esta sección.':'Crea un PIN de 4 a 6 dígitos para proteger esta sección.')+'</div><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN"><button class="btn p fab" id="pgo">'+(S.D.pin?'Entrar':'Crear PIN')+'</button></div>'}
function hashPin(p){var h=2166136261;for(var i=0;i<p.length;i++){h^=p.charCodeAt(i);h=Math.imul(h,16777619)}return String(h>>>0)}
function gestHTML(){
  var h='<h1>Gestión</h1><div class="sub">Fechas, renovaciones y pendientes</div><div class="chips">'+Object.keys(CATS).map(function(k){var n=S.D.items.filter(function(i){return i.cat===k}).length;return '<button class="chip'+(S.gs===k?' on':'')+'" data-gs="'+k+'">'+CATS[k].n+(k!=='med'&&n?' · '+n:'')+'</button>'}).join('')+'</div>';
  if(S.gs==='med'&&!S.unlocked)return h+lockHTML();
  var list=S.D.items.filter(function(i){return i.cat===S.gs}).sort(function(a,b){return a.date<b.date?-1:1});
  h+='<div class="card"><h2>'+CATS[S.gs].n+'</h2>';
  if(S.gs==='sub'&&list.length){var nx=list[0];h+='<div class="s" style="font-size:12px;color:var(--dim);margin-bottom:6px">'+list.length+' activas · próxima: '+esc(nx.name)+' '+(dleft(nx.date)<=0?'hoy':'en '+dleft(nx.date)+' d')+'</div>'}
  h+=(list.map(function(it){return '<div class="row" data-it="'+it.id+'"><div class="t"><div class="n">'+esc(it.name)+'</div><div class="s">'+(it.where?esc(it.where)+' · ':'')+new Date(it.date+'T00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})+(it.ev?' · '+(REP.filter(function(r){return r[0]===it.ev})[0]||[0,'cada '+it.ev+' d'])[1].toLowerCase():'')+'</div></div>'+itemBadge(it)+'</div>'}).join('')||'<div class="empty">Nada registrado todavía.</div>');
  h+='<button class="btn p fab" data-add="1">+ Agregar</button></div>';
  if(S.gs==='med')h+='<button class="btn fab" id="plock">Bloquear sección</button>';
  return h;
}
function openModal(it,preset){
  var isNew=!it;it=it||{id:'i'+Date.now(),cat:S.gs,name:preset||'',date:key(today()),ev:CATS[S.gs].ev,where:'',al:7};
  S.modal=it;
  var ch=isNew?'<div class="chips" style="margin-top:8px">'+CATS[it.cat].p.map(function(p){return '<button class="chip" data-pr="'+esc(p)+'">'+esc(p)+'</button>'}).join('')+'</div>':'';
  $('#md').innerHTML='<div class="modal" id="mbg"><div class="sheet"><b style="font-size:16px">'+(isNew?'Nuevo en ':'')+CATS[it.cat].n+'</b>'+ch+
  '<label>Nombre</label><input id="f_n" value="'+esc(it.name)+'">'+
  (it.cat==='sub'?'<label>Dónde se cobra (tarjeta o cuenta)</label><input id="f_w" value="'+esc(it.where)+'">':'')+
  '<label>'+(it.cat==='sub'?'Próxima renovación o vencimiento':'Fecha')+'</label><input id="f_d" type="date" value="'+it.date+'">'+
  '<label>Repetir</label><select id="f_e">'+REP.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===(it.ev||0)?' selected':'')+'>'+r[1]+'</option>'}).join('')+'</select>'+
  '<label>Avisar con anticipación</label><select id="f_a">'+[1,3,7,15,30].map(function(a){return '<option value="'+a+'"'+(a===(it.al==null?7:it.al)?' selected':'')+'>'+a+' día'+(a>1?'s':'')+' antes</option>'}).join('')+'</select>'+
  '<div class="acts"><button class="btn p" id="m_s" style="flex:1">Guardar</button>'+(isNew?'':'<button class="btn" id="m_h" style="flex:1">'+(it.ev?'Hecho · siguiente':'Hecho')+'</button>')+'<button class="btn" id="m_x">Cerrar</button></div>'+(isNew?'':'<button class="btn w fab" id="m_d">Eliminar</button>')+'</div></div>';
  $('#mbg').onclick=function(e){if(e.target.id==='mbg')closeModal()};
  $('#m_x').onclick=closeModal;
  [].forEach.call(document.querySelectorAll('[data-pr]'),function(b){b.onclick=function(){$('#f_n').value=b.dataset.pr}});
  $('#m_s').onclick=function(){var n=$('#f_n').value.trim();if(!n||!$('#f_d').value)return;it.name=n;it.date=$('#f_d').value;it.ev=parseInt($('#f_e').value,10);it.al=parseInt($('#f_a').value,10);if($('#f_w'))it.where=$('#f_w').value.trim();
    var ix=S.D.items.map(function(x){return x.id}).indexOf(it.id);if(ix<0)S.D.items.push(it);else S.D.items[ix]=it;saveD();closeModal()};
  if(!isNew){$('#m_d').onclick=function(){S.D.items=S.D.items.filter(function(x){return x.id!==it.id});saveD();closeModal()};
    $('#m_h').onclick=function(){if(!it.ev){S.D.items=S.D.items.filter(function(x){return x.id!==it.id})}else{var fromDate=(it.cat==='sub'||it.cat==='moto');var n=fromDate?it.date:key(today());do{n=addDays(n,it.ev)}while(fromDate&&dleft(n)<=0);it.date=n;var ix=S.D.items.map(function(x){return x.id}).indexOf(it.id);if(ix>=0)S.D.items[ix]=it}saveD();closeModal()}}
}
function closeModal(){S.modal=null;$('#md').innerHTML='';render()}
function bind(){
  var q=function(s,f){[].forEach.call(document.querySelectorAll(s),f)};
  q('.cell',function(b){b.onclick=function(){S.sel=S.sel===b.dataset.d?'':b.dataset.d;render()}});
  q('.pick button',function(b){b.onclick=function(){var v=b.dataset.v;if(v==='x')delete S.dl[S.sel];else S.dl[S.sel]=v;S.sel='';saveDl();render()}});
  var pv=$('#pv'),nx=$('#nx');if(pv){pv.onclick=function(){S.cm--;render()};nx.onclick=function(){S.cm++;render()}}
  q('[data-cal]',function(b){b.onclick=function(){var k=b.dataset.cal;if(S.D.hid[k])delete S.D.hid[k];else S.D.hid[k]=1;saveD();render()}});
  q('[data-go]',function(b){b.onclick=function(){S.tab=b.dataset.go;if(b.dataset.cat&&CATS[b.dataset.cat])S.gs=b.dataset.cat;render()}});
  q('[data-tg]',function(b){b.onclick=function(){var id=b.dataset.tg;call(id.split('.')[0],'toggle',{},{entity_id:id})}});
  q('[data-sc]',function(b){b.onclick=function(){if(b.dataset.conf&&!confirm('Esto apaga las pantallas y, en 1 minuto, la torre. ¿Cerraste Windows?'))return;var id=b.dataset.sc,d=id.split('.')[0];call(d,d==='button'?'press':'turn_on',{},{entity_id:id})}});
  q('[data-vc]',function(b){b.onclick=function(){var v=find(/bartolo/i,['vacuum'])[0];if(v)call('vacuum',b.dataset.vc,{},{entity_id:v.entity_id})}});
  q('[data-gs]',function(b){b.onclick=function(){S.gs=b.dataset.gs;render()}});
  q('[data-it]',function(b){b.onclick=function(){var it=S.D.items.filter(function(x){return x.id===b.dataset.it})[0];if(it)openModal(JSON.parse(JSON.stringify(it)))}});
  q('[data-add]',function(b){b.onclick=function(){openModal()}});
  var ta=$('#ta');if(ta){var add=function(){var v=$('#ti').value.trim();if(!v)return;call('todo','add_item',{item:v},{entity_id:todoEnt()});$('#ti').value='';setTimeout(loadTodo,400)};ta.onclick=add;$('#ti').onkeydown=function(e){if(e.key==='Enter')add()}}
  q('[data-ti]',function(b){b.onclick=function(){var it=S.todo.filter(function(i){return(i.uid||i.summary)===b.dataset.ti})[0];if(!it)return;call('todo','update_item',{item:it.uid||it.summary,status:it.status==='completed'?'needs_action':'completed'},{entity_id:todoEnt()});setTimeout(loadTodo,400)}});
  var tc=$('#tc');if(tc)tc.onclick=function(){call('todo','remove_completed_items',{},{entity_id:todoEnt()});setTimeout(loadTodo,400)};
  var pg=$('#pgo');if(pg)pg.onclick=function(){var p=$('#pin').value.trim();if(!/^\d{4,6}$/.test(p)){$('#pin').value='';$('#pin').placeholder='Solo 4 a 6 dígitos';return}
    if(!S.D.pin){S.D.pin=hashPin(p);saveD();S.unlocked=true;render()}else if(hashPin(p)===S.D.pin){S.unlocked=true;render()}else{$('#pin').value='';$('#pin').placeholder='PIN incorrecto'}};
  var pl=$('#plock');if(pl)pl.onclick=function(){S.unlocked=false;render()};
}
render();connect();
})();
</script>
</body>
</html>
