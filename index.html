.pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--glass-fill);border:1px solid var(--glass-border);border-radius:var(--radius-card-md);padding:10px 4px;font-size:12px}
.cd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--glass-fill-strong);flex-shrink:0}.dot.on{background:var(--state-ok)}.dot.al{background:var(--state-bad)}
.status{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:var(--space-4);font-size:12px;color:var(--text-tertiary);display:flex;gap:6px;align-items:center;z-index:5}
.modal{position:fixed;inset:0;background:rgba(10,6,5,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:520px;background:rgba(43,15,9,.82);border:1px solid var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:var(--radius-card-lg) var(--radius-card-lg) 0 0;padding:var(--space-6) var(--space-6) calc(var(--space-6) + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;box-shadow:var(--shadow-glass)}
.sheet label,label.hint{font-size:14px;color:var(--text-secondary);display:block;margin-top:var(--space-2)}
.acts{display:flex;gap:var(--space-2);margin-top:var(--space-4)}.acts .btn{flex:1}
.empty{font-size:15px;color:var(--text-secondary);padding:4px 0}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text-secondary);flex-shrink:0}.chk.d{background:var(--active-fill);border-color:var(--active-fill)}
.done .n{text-decoration:line-through;color:var(--text-secondary)}
.mapw{position:relative;width:100%;margin:0 auto;overflow:hidden;border-radius:var(--radius-card-md);background:rgba(10,6,5,.55)}
.hint{font-size:14px;line-height:18px;color:var(--text-secondary)}
.hgrid,.hcol{display:flex;flex-direction:column;gap:var(--space-3)}
.ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:conic-gradient(var(--active-fill) calc(var(--p)*1%),var(--glass-fill) 0)}
.ring>div{width:78px;height:78px;border-radius:50%;background:var(--bg-ember-900);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:26px;font-weight:400}.ring small{font-size:12px;line-height:14px;color:var(--text-secondary)}
.hero{flex-direction:row;align-items:center;gap:var(--space-4);border-radius:var(--radius-card-lg);padding:var(--space-6)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--active-fill);outline-offset:2px}
@media(min-width:900px){
 main{max-width:1240px;padding:var(--space-8) var(--space-8) var(--space-8) 236px}
 .dock{left:16px;top:16px;bottom:16px;transform:none;width:196px;max-width:none;height:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:var(--space-5) var(--space-2);gap:6px;border-radius:var(--radius-card-lg)}
 .dock button{flex:none;height:48px;justify-content:flex-start;padding:0 var(--space-4);gap:12px;font-size:15px}
 .dock button span,.dock button.on span{display:inline}
 .hgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--space-4);align-items:start}

}
@media(min-width:900px){.dhg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--space-4);align-items:start}.dhg .scenes{grid-column:2;grid-row:1}.dhg .dhmap{grid-column:2;grid-row:2}.dhg .panel{grid-column:1;grid-row:1/3}}

@media(min-width:1500px){main{zoom:1.22}.dock{zoom:1.22}.status{zoom:1.22}}

SCREENS.moto=function(){
  var M=S.D.moto||MOTO0,C=CATS.moto,list=itemsOf('moto'),c=motoCalc(M);
  var h=hdr('Moto','TVS Apache RTR 160 4V');
  h+='<div class="bhero mo"><img src="'+MOTO_IMG+'" alt="" draggable="false"><div class="bl"><div><small>TVS</small><h2>Apache RTR 160</h2></div><div style="display:flex;gap:var(--space-6);align-items:stretch"><div><small>Odómetro</small><b>'+M.odo.toLocaleString('es-CO')+' km</b></div><i class="div"></i><div><small>Gasolina</small><b>'+c.pct+' %</b></div></div><div><small>Próximo aceite</small><b>'+(c.oilLeft<=0?'Ya toca':'en '+c.oilLeft+' km')+'</b></div></div></div>';
  var rowsM=[row({ic:IC.fuel,t:'Tanque',s:'Trip 1 · '+M.tripFuel+' km desde el último tanqueo',r:'<span class="'+(c.fuelLeft<=60?'bad-t':'off-t')+'">'+(c.fuelLeft<=0?'Tanquear':'~'+c.fuelLeft+' km')+'</span>'}),
         row({ic:IC.fuel,t:'Cambio de aceite',s:'Trip 2 · '+M.tripOil+' km · cada '+M.oilEvery+' km',r:'<span class="'+(c.oilLeft<=300?'bad-t':'off-t')+'">'+(c.oilLeft<=0?'Ya toca':'en '+c.oilLeft+' km')+'</span>'}),
         row({ic:IC.cal,t:'Lavado',s:'Cada '+M.washEvery+' días',r:'<span class="'+(c.wash<=0?'bad-t':'off-t')+'">'+(c.wash<=0?'Ya toca':'en '+c.wash+' d')+'</span>'})];
  if(c.chain!=null)rowsM.splice(2,0,row({ic:IC.moto,t:'Kit de arrastre',s:'Lubricar cada '+M.chainEvery+' km',r:'<span class="'+(c.chain<=100?'bad-t':'off-t')+'">'+(c.chain<=0?'Ya toca':'en '+c.chain+' km')+'</span>'}));
  if(c.kmL)rowsM.push(row({ic:IC.fuel,t:'Rendimiento real',s:'Promedio de tus últimos tanqueos',r:'<span class="on-t">'+c.kmL.toFixed(1)+' km/L</span>'}));
  h+=card('Mantenimiento','<div class="bar"><i style="width:'+c.pct+'%"></i></div>'+tiles(rowsM)+chips(['<button class="btn p" id="mo_t">Registrar tanqueo</button>','<button class="btn" id="mo_o">Cambié el aceite</button>','<button class="btn" id="mo_e">Ajustar datos</button>']));
  var live=S.states[MH.odo]?'Sincronizado con tu app TVS':'Esperando datos de tu app TVS';
  h+=card('Conexión con tu app TVS','<div class="hint">'+live+'. Tu app puede enviar el odómetro (y los trips) a Home Assistant: entidades <b>input_number.moto_odo</b>, <b>moto_trip_gasolina</b> y <b>moto_trip_aceite</b>. Si solo llega el odómetro, Vida suma los km a los trips y calcula el gasto real.</div>');
  var mkm=function(it){return row({ic:IC.moto,t:esc(it.name)+(it.demo?' <span class="badge">ejemplo</span>':''),s:new Date(it.date+'T00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}),r:itemBadge(it),at:'data-it="'+it.id+'"'})};
  h+=list.length?rangeCards(list,mkm):card('Documentos y fechas','<div class="empty">Nada registrado.</div>');
  h+='<button class="btn p f" data-add="moto">+ Agregar</button>';
  return h};
function openMoto(){
  var M=S.D.moto,F=[['odo','Odómetro (km)'],['tripFuel','Trip 1 · gasolina (km)'],['tripOil','Trip 2 · aceite (km)'],['range','Autonomía de un tanque (km)'],['oilEvery','Cambio de aceite cada (km)'],['chainAt','Último lubricado de cadena (km del odómetro, 0 = no usar)'],['chainEvery','Cadena cada (km, 0 = no usar)'],['washEvery','Lavar cada (días)']];
  modalShell('<div class="tt" style="font-size:24px;line-height:28px">Datos de la moto</div>'+F.map(function(f){return '<label>'+f[1]+'</label><input id="mo_'+f[0]+'" type="number" inputmode="numeric" value="'+M[f[0]]+'">'}).join('')+'<label>Último lavado</label><input id="mo_washLast" type="date" value="'+M.washLast+'"><div class="acts"><button class="btn p" id="mo_s">Guardar</button><button class="btn" id="mo_x">Cerrar</button></div>');
  $('#mo_x').onclick=closeModal;
  $('#mo_s').onclick=function(){F.forEach(function(f){var v=parseFloat($('#mo_'+f[0]).value);if(!isNaN(v))M[f[0]]=Math.max(0,v)});M.range=Math.max(50,M.range);M.lastOdo=M.odo;M.washLast=$('#mo_washLast').value||M.washLast;M.adj=1;saveD();pushMoto();closeModal()}}
function openTanqueo(){
  var M=S.D.moto;modalShell('<div class="tt" style="font-size:24px;line-height:28px">Registrar tanqueo</div><div class="hint">Tu Trip 1 marca '+M.tripFuel+' km. Con los litros que echaste, Vida calcula tu rendimiento real.</div><label>Litros</label><input id="tq_l" type="number" inputmode="decimal" step="0.01" placeholder="Ej. 7.5"><div class="acts"><button class="btn p" id="tq_s">Guardar</button><button class="btn" id="tq_x">Cerrar</button></div>');
  $('#tq_x').onclick=closeModal;
  $('#tq_s').onclick=function(){var l=parseFloat($('#tq_l').value);if(!(l>0))return;M.fills=M.fills||[];if(M.tripFuel>0)M.fills.push({odo:M.odo,l:l,kmL:M.tripFuel/l,d:key(today())});M.fills=M.fills.slice(-30);M.tripFuel=0;saveD();pushMoto();closeModal()}}

   [!!S.states[MH.odo],'App TVS conectada','Tu app envía el odómetro a Home Assistant (input_number.moto_odo)','moto'],
   [Object.keys(S.dl||{}).length>3,'Bitácora','Marca tus días de oficina, casa y finde','home'],

   [false,'Gato Lio real','Falta el archivo .glb (por ahora hay un gato aleatorio en el mapa)','casa'],

  q('[data-mv]',function(b){b.onclick=function(){S.mv=b.dataset.mv;S.mr=null;S.mz=1;S.mtx=0;S.mty=0;render()}});
  q('[data-mz]',function(b){b.onclick=function(){zoomAt((S.mz||1)*(b.dataset.mz==='1'?1.5:1/1.5),.5,.5);render()}});
  q('[data-cl]',function(b){b.onclick=function(){var c=b.dataset.cl.split(','),px=parseFloat(c[0])/100,py=parseFloat(c[1])/100,nz=Math.min(3.2,(S.mz||1)*2.2);S.mz=nz;S.mtx=.5-px*nz;S.mty=.5-py*nz;clampT();render()}});
  q('[data-rot]',function(b){b.onclick=function(){var top=S.mv==='top',cur=S.mr!=null?S.mr:(top?90:-50);S.mr=cur+parseInt(b.dataset.rot,10)*(top?90:45);render()}});
  q('[data-fi]',function(b){b.onclick=function(e){var f=S._sc&&S._sc.faces[parseInt(b.dataset.fi,10)];if(f&&f.go)f.go(e)}});
  q('[data-pi]',function(b){b.onclick=function(e){e.stopPropagation();var p=S._sc&&S._sc.pucks[parseInt(b.dataset.pi,10)];if(p&&p.go)p.go()}});
  q('[data-mmove]',function(b){b.onclick=function(){S.mmove=b.dataset.mmove;render()}});
  q('[data-mcancel]',function(b){b.onclick=function(){S.mmove='';render()}});
  q('[data-fe]',function(b){b.onclick=function(){S.fe=!S.fe;S.msel='';S.mmove='';S.fr=null;S.fsel='';render()}});
  q('[data-fadd]',function(b){b.onclick=function(){var c=FCAT[parseInt(b.dataset.fadd,10)],id='f'+Date.now();S.D.furn.push({id:id,f:S.mf,r:S.fr,n:c[0],w:c[1],d:c[2],h:c[3],dx:0,dy:0,c:c[4]});S.fsel=id;saveD();render()}});
  q('[data-fsel]',function(b){b.onclick=function(){S.fsel=b.dataset.fsel;render()}});
  q('[data-fact]',function(b){b.onclick=function(){var p=b.dataset.fact.split(':'),k=p[0],dl=parseFloat(p[1]),f=S.D.furn.filter(function(z){return z.id===S.fsel})[0];if(!f)return;f[k]=Math.round((f[k]+dl)*100)/100;if(k==='w'||k==='d')f[k]=Math.max(.1,f[k]);if(k==='h')f[k]=Math.max(.02,f[k]);saveD();render()}});
  q('[data-fdel]',function(b){b.onclick=function(){S.D.furn=S.D.furn.filter(function(z){return z.id!==S.fsel});S.fsel='';saveD();render()}});
  q('[data-cl]',function(b){b.onclick=function(){var it=S.D.closet.filter(function(x){return x.id===b.dataset.cl})[0];if(it)openCloset(JSON.parse(JSON.stringify(it)))}});
  q('[data-cladd]',function(b){b.onclick=function(){openCloset()}});
  q('[data-eq]',function(b){b.onclick=function(){var it=S.D.equip.filter(function(x){return x.id===b.dataset.eq})[0];if(it)openEquip(JSON.parse(JSON.stringify(it)))}});
  q('[data-eqadd]',function(b){b.onclick=function(){openEquip()}});
  var me=$('#mo_e');if(me)me.onclick=openMoto;
  var mt=$('#mo_t');if(mt)mt.onclick=openTanqueo;
  var mi=$('#mo_o');if(mi)mi.onclick=function(){swipeConfirm('Cambio de aceite','El Trip 2 vuelve a 0.',function(){S.D.moto.tripOil=0;saveD();pushMoto();render()})};
  var ns=$('#a_ns');if(ns)ns.onclick=function(){S.D.name=$('#a_name').value.trim()||'Juan';saveD();render()};
  q('[data-cat]',function(b){b.onclick=function(){CAT.on=!CAT.on;S.D.cat=CAT.on;saveD();render()}});
  var ap=$('#a_pin');if(ap)ap.onclick=function(){if(confirm('¿Quitar el PIN?')){S.D.pin='';S.unlocked=false;saveD();render()}};
  var ae=$('#a_exp');if(ae)ae.onclick=function(){var j=JSON.stringify({D:S.D,dl:S.dl});var ta=$('#a_ta');ta.style.display='block';ta.value=j;ta.select();try{navigator.clipboard.writeText(j)}catch(e){try{document.execCommand('copy')}catch(e2){}}ae.textContent='Copiado'};
  var ai=$('#a_imp');if(ai)ai.onclick=function(){var ta=$('#a_ta');if(ta.style.display==='none'){ta.style.display='block';ta.value='';ai.textContent='Aplicar';return}try{var o=JSON.parse(ta.value);if(!o.D)throw 0;S.D=o.D;if(o.dl){S.dl=o.dl;saveDl()}saveD();render()}catch(e){ai.textContent='Respaldo inválido'}};
  var ad=$('#a_demo');if(ad)ad.onclick=function(){if(confirm('¿Borrar los registros de ejemplo?')){S.D.items=S.D.items.filter(function(i){return !i.demo});saveD();render()}};
  frBind();
  var lo=$('#logout');if(lo)lo.onclick=function(){if(confirm('¿Desconectar este dispositivo?')){localStorage.removeItem('vida-token');location.reload()}};
}
setInterval(function(){if(S.scr==='home'&&S.tok)softRender()},30000);
render();connect();
})();
</script>
</body>
</html>
