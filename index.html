<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14111a">
<meta name="mobile-web-app-capable" content="yes">
<title>Vida</title>
<style>

[data-theme=amanecer]{--bg:#fbf1e6;--g1:#ffd9b8;--g2:#f6c8d8;--glass:rgba(255,255,255,.62);--glass-hi:rgba(255,255,255,.95);--faint:rgba(70,45,30,.12);--ink:#2b2230;--dim:#7a6c80;--navbg:rgba(251,241,230,.92);--sheet:#fff7ee;--text:#2b2230}
[data-theme=bruma]{--bg:#dfe6ee;--g1:#c3d1e3;--g2:#d8e0d4;--glass:rgba(255,255,255,.55);--glass-hi:rgba(255,255,255,.9);--faint:rgba(30,50,70,.12);--ink:#1f2a36;--dim:#64748a;--navbg:rgba(223,230,238,.92);--sheet:#f2f5f9;--text:#1f2a36}
.mapbox{background:#1d1a27;border-radius:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,var(--g1) 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,var(--g2) 0,transparent 55%),var(--bg);padding:env(safe-area-inset-top) 0 96px}
main{max-width:560px;margin:0 auto;padding:16px 16px 0}
h1{font-size:22px;font-weight:600;margin:6px 0 2px}
.sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.card{background:var(--glass);border:1px solid var(--faint);border-radius:24px;padding:14px;margin-bottom:12px;backdrop-filter:blur(14px)}
.card h2{font-size:13px;font-weight:500;color:var(--dim);margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--faint);cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .n{font-size:14px}.row .s{font-size:11.5px;color:var(--dim)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--glass-hi);border-radius:14px;padding:9px 14px;font-size:13px}
.btn.p{background:var(--acc);color:#1d1a22;font-weight:600}
.btn.w{background:rgba(255,107,107,.18);color:#ffb1b1}
.sw{width:46px;height:27px;border-radius:14px;background:var(--faint);position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex-shrink:0}.dot.on{background:var(--ok)}.dot.al{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:var(--navbg);backdrop-filter:blur(16px);border-top:1px solid var(--faint);z-index:6}
nav button{flex:1;max-width:110px;padding:10px 4px;border-radius:16px;background:transparent;color:var(--dim);font-size:12.5px}
nav button.on{background:var(--glass-hi);color:var(--ink)}
input,select{font:inherit;width:100%;background:var(--glass);border:1px solid var(--faint);color:var(--ink);border-radius:14px;padding:11px 12px;margin:5px 0}
select option{color:#000}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--dim);padding:4px 0}
.cell{background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.cell .egg{width:36px;height:40px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;display:flex;align-items:center;justify-content:center;background:var(--faint)}
.cell .num{font-size:10.5px;color:var(--dim)}.cell.today .num{color:var(--acc);font-weight:700}
.cell.sel .egg{outline:2px solid var(--ink)}
.cnt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.cnt span{display:flex;align-items:center;gap:6px;font-size:13px}
.mini{width:14px;height:16px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.hd b{font-weight:500;font-size:15px;text-transform:capitalize}
.pick{display:flex;gap:8px;margin-top:10px}
.pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--glass);border-radius:18px;padding:10px 4px;font-size:11px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--faint)}.stat span:first-child{color:var(--dim)}
.status{position:fixed;top:8px;right:12px;font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center;z-index:5}
.big{font-size:34px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--glass);border:1px solid var(--faint);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.chip.on{color:var(--ink);background:var(--glass-hi)}
.cd{width:8px;height:8px;border-radius:50%}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--faint);color:var(--dim);white-space:nowrap}
.badge.warn{background:rgba(255,196,77,.18);color:var(--warn)}.badge.bad{background:rgba(255,107,107,.2);color:#ffb1b1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--sheet);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet label{font-size:11.5px;color:var(--dim);display:block;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:12px}
.empty{font-size:12.5px;color:var(--dim);padding:6px 0}
.fab{width:100%;margin-top:8px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex-shrink:0}.chk.d{background:var(--ok);border-color:var(--ok)}
.done .n{text-decoration:line-through;color:var(--dim)}
</style>
</head>

<nav id="nav"></nav>

  '<label>'+(it.cat==='sub'?'Próxima renovación o vencimiento':'Fecha')+'</label><input id="f_d" type="date" value="'+it.date+'">'+
  '<label>Repetir</label><select id="f_e">'+REP.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===(it.ev||0)?' selected':'')+'>'+r[1]+'</option>'}).join('')+'</select>'+
  '<label>Avisar con anticipación</label><select id="f_a">'+[1,3,7,15,30].map(function(a){return '<option value="'+a+'"'+(a===(it.al==null?7:it.al)?' selected':'')+'>'+a+' día'+(a>1?'s':'')+' antes</option>'}).join('')+'</select>'+
  '<div class="acts"><button class="btn p" id="m_s" style="flex:1">Guardar</button>'+(isNew?'':'<button class="btn" id="m_h" style="flex:1">'+(it.ev?'Hecho · siguiente':'Hecho')+'</button>')+'<button class="btn" id="m_x">Cerrar</button></div>'+(isNew?'':'<button class="btn w fab" id="m_d">Eliminar</button>')+'</div></div>';
  $('#mbg').onclick=function(e){if(e.target.id==='mbg')closeModal()};
  $('#m_x').onclick=closeModal;
  [].forEach.call(document.querySelectorAll('[data-pr]'),function(b){b.onclick=function(){$('#f_n').value=b.dataset.pr}});
  $('#m_s').onclick=function(){var n=$('#f_n').value.trim();if(!n||!$('#f_d').value)return;it.name=n;it.date=$('#f_d').value;it.ev=parseInt($('#f_e').value,10);it.al=parseInt($('#f_a').value,10);if($('#f_w'))it.where=$('#f_w').value.trim();
    var ix=S.D.items.map(function(x){return x.id}).indexOf(it.id);if(ix<0)S.D.items.push(it);else S.D.items[ix]=it;saveD();closeModal()};
  if(!isNew){$('#m_d').onclick=function(){S.D.items=S.D.items.filter(function(x){return x.id!==it.id});saveD();closeModal()};
    $('#m_h').onclick=function(){if(!it.ev){S.D.items=S.D.items.filter(function(x){return x.id!==it.id})}else{var fromDate=(it.cat==='sub'||it.cat==='moto');var n=fromDate?it.date:key(today());do{n=addDays(n,it.ev)}while(fromDate&&dleft(n)<=0);it.date=n;var ix=S.D.items.map(function(x){return x.id}).indexOf(it.id);if(ix>=0)S.D.items[ix]=it}saveD();closeModal()}}
}
function closeModal(){S.modal=null;$('#md').innerHTML='';render()}
function bind(){
  var q=function(s,f){[].forEach.call(document.querySelectorAll(s),f)};
  q('.cell',function(b){b.onclick=function(){S.sel=S.sel===b.dataset.d?'':b.dataset.d;render()}});
  q('.pick button',function(b){b.onclick=function(){var v=b.dataset.v;if(v==='x')delete S.dl[S.sel];else S.dl[S.sel]=v;S.sel='';saveDl();render()}});
  var pv=$('#pv'),nx=$('#nx');if(pv){pv.onclick=function(){S.cm--;render()};nx.onclick=function(){S.cm++;render()}}
  q('[data-cal]',function(b){b.onclick=function(){var k=b.dataset.cal;if(S.D.hid[k])delete S.D.hid[k];else S.D.hid[k]=1;saveD();render()}});
  q('[data-go]',function(b){b.onclick=function(){S.tab=b.dataset.go;if(b.dataset.cat&&CATS[b.dataset.cat])S.gs=b.dataset.cat;render()}});
  q('[data-tg]',function(b){b.onclick=function(){var id=b.dataset.tg;call(id.split('.')[0],'toggle',{},{entity_id:id})}});
  q('[data-sc]',function(b){b.onclick=function(){if(b.dataset.conf&&!confirm('Esto apaga las pantallas y, en 1 minuto, la torre. ¿Cerraste Windows?'))return;var id=b.dataset.sc,d=id.split('.')[0];call(d,d==='button'?'press':'turn_on',{},{entity_id:id})}});
  q('[data-vc]',function(b){b.onclick=function(){var v=find(/bartolo/i,['vacuum'])[0];if(v)call('vacuum',b.dataset.vc,{},{entity_id:v.entity_id})}});
  q('[data-gs]',function(b){b.onclick=function(){S.gs=b.dataset.gs;render()}});
  q('[data-it]',function(b){b.onclick=function(){var it=S.D.items.filter(function(x){return x.id===b.dataset.it})[0];if(it)openModal(JSON.parse(JSON.stringify(it)))}});
  q('[data-add]',function(b){b.onclick=function(){openModal()}});
  var ta=$('#ta');if(ta){var add=function(){var v=$('#ti').value.trim();if(!v)return;call('todo','add_item',{item:v},{entity_id:todoEnt()});$('#ti').value='';setTimeout(loadTodo,400)};ta.onclick=add;$('#ti').onkeydown=function(e){if(e.key==='Enter')add()}}
  q('[data-ti]',function(b){b.onclick=function(){var it=S.todo.filter(function(i){return(i.uid||i.summary)===b.dataset.ti})[0];if(!it)return;call('todo','update_item',{item:it.uid||it.summary,status:it.status==='completed'?'needs_action':'completed'},{entity_id:todoEnt()});setTimeout(loadTodo,400)}});
  var tc=$('#tc');if(tc)tc.onclick=function(){call('todo','remove_completed_items',{},{entity_id:todoEnt()});setTimeout(loadTodo,400)};
  var pg=$('#pgo');if(pg)pg.onclick=function(){var p=$('#pin').value.trim();if(!/^\d{4,6}$/.test(p)){$('#pin').value='';$('#pin').placeholder='Solo 4 a 6 dígitos';return}
    if(!S.D.pin){S.D.pin=hashPin(p);saveD();S.unlocked=true;render()}else if(hashPin(p)===S.D.pin){S.unlocked=true;render()}else{$('#pin').value='';$('#pin').placeholder='PIN incorrecto'}};

  q('[data-mf]',function(b){b.onclick=function(){S.mf=parseInt(b.dataset.mf,10);render()}});
  q('[data-mv]',function(b){b.onclick=function(){S.mv=b.dataset.mv;S.mr=null;render()}});
  q('[data-rot]',function(b){b.onclick=function(){var top=S.mv==='top',cur=S.mr!=null?S.mr:(top?90:-50);S.mr=cur+parseInt(b.dataset.rot,10)*(top?90:45);render()}});
  q('[data-fi]',function(b){b.onclick=function(e){var f=S._sc&&S._sc.faces[parseInt(b.dataset.fi,10)];if(f&&f.go)f.go(e)}});
  q('[data-pi]',function(b){b.onclick=function(e){e.stopPropagation();var p=S._sc&&S._sc.pucks[parseInt(b.dataset.pi,10)];if(p&&p.go)p.go()}});
  q('[data-fe]',function(b){b.onclick=function(){S.fe=!S.fe;S.msel='';S.mmove='';S.fr=null;S.fsel='';render()}});
  q('[data-fadd]',function(b){b.onclick=function(){var c=FCAT[parseInt(b.dataset.fadd,10)],id='f'+Date.now();S.D.furn.push({id:id,f:S.mf,r:S.fr,n:c[0],w:c[1],d:c[2],h:c[3],dx:0,dy:0,c:c[4]});S.fsel=id;saveD();render()}});
  q('[data-fsel]',function(b){b.onclick=function(){S.fsel=b.dataset.fsel;render()}});
  q('[data-fact]',function(b){b.onclick=function(){var p=b.dataset.fact.split(':'),k=p[0],dl=parseFloat(p[1]);var f=S.D.furn.filter(function(z){return z.id===S.fsel})[0];if(!f)return;f[k]=Math.round((f[k]+dl)*100)/100;if(k==='w'||k==='d')f[k]=Math.max(.1,f[k]);if(k==='h')f[k]=Math.max(.02,f[k]);saveD();render()}});
  q('[data-fdel]',function(b){b.onclick=function(){S.D.furn=S.D.furn.filter(function(z){return z.id!==S.fsel});S.fsel='';saveD();render()}});
  q('[data-th]',function(b){b.onclick=function(){localStorage.setItem('vida-theme',b.dataset.th);document.documentElement.setAttribute('data-theme',b.dataset.th);render()}});
  q('[data-cl]',function(b){b.onclick=function(){var it=S.D.closet.filter(function(x){return x.id===b.dataset.cl})[0];if(it)openCloset(JSON.parse(JSON.stringify(it)))}});
  q('[data-cladd]',function(b){b.onclick=function(){openCloset()}});
  var lo=$('#logout');if(lo)lo.onclick=function(){if(confirm('¿Desconectar este dispositivo?')){localStorage.removeItem('vida-token');location.reload()}};
  q('[data-mmove]',function(b){b.onclick=function(){S.mmove=b.dataset.mmove;render()}});
  q('[data-mcancel]',function(b){b.onclick=function(){S.mmove='';render()}});
  var pl=$('#plock');if(pl)pl.onclick=function(){S.unlocked=false;render()};
}
render();connect();
})();
</script>
</body>
</html>
