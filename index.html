<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22Vida%22%2C%20%22short_name%22%3A%20%22Vida%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22orientation%22%3A%20%22portrait%22%2C%20%22background_color%22%3A%20%22%2314111a%22%2C%20%22theme_color%22%3A%20%22%2314111a%22%2C%20%22start_url%22%3A%20%22/local/vida/index.html%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A//www.w3.org/2000/svg%2527%2520viewBox%253D%25270%25200%2520192%2520192%2527%253E%253Crect%2520width%253D%2527192%2527%2520height%253D%2527192%2527%2520rx%253D%252744%2527%2520fill%253D%2527%252314111a%2527/%253E%253Cpath%2520d%253D%2527M96%252040c28%25200%252044%252030%252044%252058%25200%252028-18%252054-44%252054S52%2520126%252052%252098c0-28%252016-58%252044-58z%2527%2520fill%253D%2527%2523f28b1e%2527/%253E%253Ccircle%2520cx%253D%252780%2527%2520cy%253D%252794%2527%2520r%253D%25276%2527%2520fill%253D%2527%25231d1a22%2527/%253E%253Ccircle%2520cx%253D%2527112%2527%2520cy%253D%252794%2527%2520r%253D%25276%2527%2520fill%253D%2527%25231d1a22%2527/%253E%253Cpath%2520d%253D%2527M82%2520116c8%25208%252020%25208%252028%25200%2527%2520stroke%253D%2527%25231d1a22%2527%2520stroke-width%253D%25276%2527%2520fill%253D%2527none%2527%2520stroke-linecap%253D%2527round%2527/%253E%253C/svg%253E%22%2C%20%22sizes%22%3A%20%22any%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%22%7D%5D%7D">
<title>Vida</title>
<style>
:root{--bg:#14111a;--glass:rgba(255,255,255,.07);--glass-hi:rgba(255,255,255,.12);--faint:rgba(255,255,255,.09);--ink:#f3eef8;--dim:#a79fb4;--acc:#f28b1e;--ok:#5ad19a;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,#3a2450 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#2a3a58 0,transparent 55%),var(--bg);padding:env(safe-area-inset-top) 0 90px}
main{max-width:560px;margin:0 auto;padding:16px 16px 0}
h1{font-size:22px;font-weight:600;margin:6px 0 2px}
.sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.card{background:var(--glass);border:1px solid var(--faint);border-radius:24px;padding:14px;margin-bottom:12px;backdrop-filter:blur(14px)}
.card h2{font-size:13px;font-weight:500;color:var(--dim);margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--faint)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .n{font-size:14px}.row .s{font-size:11.5px;color:var(--dim)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--glass-hi);border-radius:14px;padding:9px 14px;font-size:13px}
.btn.p{background:var(--acc);color:#1d1a22;font-weight:600}
.btn.w{background:rgba(255,107,107,.18);color:#ffb1b1}
.sw{width:46px;height:27px;border-radius:14px;background:var(--faint);position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex-shrink:0}.dot.on{background:var(--ok)}.dot.al{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(20,17,26,.85);backdrop-filter:blur(16px);border-top:1px solid var(--faint)}
nav button{flex:1;max-width:140px;padding:10px;border-radius:16px;background:transparent;color:var(--dim);font-size:13px}
nav button.on{background:var(--glass-hi);color:var(--ink)}
input{font:inherit;width:100%;background:var(--glass);border:1px solid var(--faint);color:var(--ink);border-radius:14px;padding:11px 12px;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--dim);padding:4px 0}
.cell{background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.cell .egg{width:36px;height:40px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;display:flex;align-items:center;justify-content:center;background:var(--faint)}
.cell .num{font-size:10.5px;color:var(--dim)}.cell.today .num{color:var(--acc);font-weight:700}
.cell.sel .egg{outline:2px solid var(--ink)}
.cnt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.cnt span{display:flex;align-items:center;gap:6px;font-size:13px}
.mini{width:14px;height:16px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.hd b{font-weight:500;font-size:15px;text-transform:capitalize}
.pick{display:flex;gap:8px;margin-top:10px}
.pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--glass);border-radius:18px;padding:10px 4px;font-size:11px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--faint)}.stat span:first-child{color:var(--dim)}
.status{position:fixed;top:8px;right:12px;font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center;z-index:5}
.hide{display:none}
.big{font-size:34px;font-weight:600}
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="stx">conectando</span></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
(function(){
'use strict';
var BC={o:'#4aa3d8',c:'#f28b1e',f:'#8e5aa8'},LB={o:'Oficina',c:'Casa',f:'Finde trabajado'};
var BIT0={};
var FACE={
o:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="8.6" cy="9.4" r="1.25" fill="#1d1a22"/><circle cx="15.4" cy="9.4" r="1.25" fill="#1d1a22"/><rect x="6.6" y="13" width="10.8" height="5" rx="2" fill="rgba(255,255,255,.92)" stroke="#1d1a22" stroke-width="1.2"/><path d="M10.2 13v5M13.8 13v5M6.6 15.5h10.8" stroke="#1d1a22" stroke-width=".8" opacity=".7"/></svg>',
c:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.8 8.2h7.4v2.4a3.7 3.7 0 0 1-7.4 0zM12.8 8.2h7.4v2.4a3.7 3.7 0 0 1-7.4 0z" fill="#1d1a22"/><path d="M11.2 8.6h1.6" stroke="#1d1a22" stroke-width="1.3" stroke-linecap="round"/><path d="M9.2 15.6c1.5 1.5 4.1 1.5 5.6 0" stroke="#1d1a22" stroke-width="1.6" stroke-linecap="round"/></svg>',
f:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6.6 7.6l3 3M9.6 7.6l-3 3M14.4 7.6l3 3M17.4 7.6l-3 3" stroke="#1d1a22" stroke-width="1.6" stroke-linecap="round"/><rect x="9.6" y="14" width="4.8" height="4.2" rx="1.4" fill="#1d1a22"/></svg>'};
function egg(v){return v?'background:linear-gradient(165deg,color-mix(in srgb,'+BC[v]+' 78%,white),'+BC[v]+')':''}
var $=function(s){return document.querySelector(s)};
var S={tab:'hoy',states:{},dl:null,cm:0,sel:'',evs:[],ws:null,id:1,pend:{},ready:false,
  base:localStorage.getItem('vida-base')||location.origin,tok:localStorage.getItem('vida-token')||''};
if(location.protocol==='file:')S.base='http://192.168.1.20';
function pad(n){return(n<10?'0':'')+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nm(e){return((e.attributes&&e.attributes.friendly_name)||e.entity_id)}
function find(re,doms){var out=[];for(var k in S.states){var e=S.states[k];if(doms&&doms.indexOf(k.split('.')[0])<0)continue;if(re.test(nm(e))||re.test(k))out.push(e)}return out}
function setStatus(t,c){$('#stx').textContent=t;$('#dot').className='dot '+(c||'')}
// ---------- WebSocket ----------
function send(o,cb){var i=S.id++;o.id=i;if(cb)S.pend[i]=cb;S.ws.send(JSON.stringify(o));return i}
function connect(){
  if(!S.tok){render();return}
  var u=S.base.replace(/^http/,'ws')+'/api/websocket';
  try{S.ws=new WebSocket(u)}catch(e){setStatus('error','al');return}
  S.ws.onmessage=function(m){var d=JSON.parse(m.data);
    if(d.type==='auth_required')S.ws.send(JSON.stringify({type:'auth',access_token:S.tok}));
    else if(d.type==='auth_invalid'){setStatus('token inválido','al');S.tok='';localStorage.removeItem('vida-token');render()}
    else if(d.type==='auth_ok'){S.ready=true;setStatus('conectado','on');boot()}
    else if(d.type==='result'){var cb=S.pend[d.id];delete S.pend[d.id];if(cb)cb(d)}
    else if(d.type==='event'&&d.event&&d.event.event_type==='state_changed'){var n=d.event.data.new_state;if(n){S.states[n.entity_id]=n;if(S.tab!=='hoy'||true)softRender()}}
  };
  S.ws.onclose=function(){S.ready=false;setStatus('reconectando','al');setTimeout(connect,4000)};
  S.ws.onerror=function(){setStatus('sin conexión','al')};
}
function boot(){
  send({type:'get_states'},function(r){(r.result||[]).forEach(function(e){S.states[e.entity_id]=e});render()});
  send({type:'subscribe_events',event_type:'state_changed'});
  send({type:'frontend/get_user_data',key:'vida_bitacora'},function(r){
    var v=r.result&&r.result.value;
    if(v&&v.dl){S.dl=v.dl}else{S.dl=JSON.parse(JSON.stringify(BIT0));saveDl()}
    render()});
  loadEvents();
}
function saveDl(){if(S.ready)send({type:'frontend/set_user_data',key:'vida_bitacora',value:{dl:S.dl}})}
function call(dom,svc,data,target){var o={type:'call_service',domain:dom,service:svc,service_data:data||{}};if(target)o.target=target;send(o)}
function loadEvents(){
  var cals=Object.keys(S.states).filter(function(k){return k.indexOf('calendar.')===0});
  if(!cals.length){setTimeout(function(){if(S.ready)loadEvents()},2500);return}
  var a=new Date();a.setHours(0,0,0,0);var b=new Date(a.getTime()+8*864e5);var seen={},all=[],left=cals.length;
  cals.forEach(function(c){
    fetch(S.base+'/api/calendars/'+c+'?start='+encodeURIComponent(a.toISOString())+'&end='+encodeURIComponent(b.toISOString()),{headers:{Authorization:'Bearer '+S.tok}})
    .then(function(r){return r.json()}).then(function(l){
      (l||[]).forEach(function(e){var st=e.start.dateTime||e.start.date;var k=e.summary+'|'+st.slice(0,10);if(!seen[k]){seen[k]=1;all.push({t:e.summary,s:st,day:!!e.start.date})}})
    }).catch(function(){}).then(function(){if(--left===0){all.sort(function(x,y){return x.s<y.s?-1:1});S.evs=all;softRender()}})
  });
}
// ---------- Render ----------
var raf=0;function softRender(){if(raf)return;raf=setTimeout(function(){raf=0;render()},150)}
function render(){
  var app=$('#app');
  if(!S.tok){app.innerHTML=setupHTML();$('#nav').innerHTML='';
    $('#go').onclick=function(){S.base=$('#base').value.replace(/\/$/,'');S.tok=$('#tok').value.trim();localStorage.setItem('vida-base',S.base);localStorage.setItem('vida-token',S.tok);connect()};return}
  $('#nav').innerHTML=[['hoy','Hoy'],['casa','Casa'],['bartolo','Bartolo']].map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){S.tab=b.dataset.t;render()}});
  app.innerHTML=S.tab==='hoy'?hoyHTML():S.tab==='casa'?casaHTML():bartoloHTML();
  bind();
}
function setupHTML(){return '<h1>Vida</h1><div class="sub">Conectar con Home Assistant</div><div class="card"><div class="s" style="font-size:12px;color:var(--dim)">Dirección del hub</div><input id="base" value="'+S.base+'"><div style="font-size:12px;color:var(--dim);margin-top:8px">Token de acceso de larga duración (HA &gt; tu perfil &gt; Seguridad)</div><input id="tok" placeholder="pega el token aquí" autocomplete="off"><button class="btn p" id="go" style="margin-top:8px;width:100%">Conectar</button></div>'}
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hoyHTML(){
  var now=new Date(),vd=new Date(now.getFullYear(),now.getMonth()+S.cm,1),dl=S.dl||{},tk=key(now);
  var lead=vd.getDay(),dim=new Date(vd.getFullYear(),vd.getMonth()+1,0).getDate(),h='';
  ['D','L','M','M','J','V','S'].forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  for(var i=0;i<lead;i++)h+='<div></div>';
  var cnt={o:0,c:0,f:0};
  for(var d=1;d<=dim;d++){var k=vd.getFullYear()+'-'+pad(vd.getMonth()+1)+'-'+pad(d),v=dl[k];if(v)cnt[v]++;
    h+='<button class="cell'+(k===tk?' today':'')+(k===S.sel?' sel':'')+'" data-d="'+k+'"><span class="egg" style="'+egg(v)+'">'+(v?FACE[v]:'<span style="color:var(--dim);font-size:18px">+</span>')+'</span><span class="num">'+d+'</span></button>'}
  var pick='';
  if(S.sel){pick='<div class="pick">'+['o','c','f'].map(function(v){return '<button data-v="'+v+'"><span class="egg" style="'+egg(v)+';width:38px;height:42px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;display:flex;align-items:center;justify-content:center">'+FACE[v]+'</span>'+LB[v]+'</button>'}).join('')+'<button data-v="x"><span style="width:38px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px">✕</span>Borrar</button></div>'}
  var ev=S.evs.slice(0,8).map(function(e){var d=new Date(e.s.length>10?e.s:e.s+'T00:00');var lab=key(d)===tk?'Hoy':d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric'});var hr=e.day?'':d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    return '<div class="row"><div class="t"><div class="n">'+esc(e.t)+'</div><div class="s">'+lab+(hr?' · '+hr:'')+'</div></div></div>'}).join('')||'<div class="s" style="font-size:12px;color:var(--dim)">Sin eventos próximos</div>';
  return '<h1>Hoy</h1><div class="sub">'+now.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})+'</div>'+
  '<div class="card"><div class="hd"><button class="btn" id="pv">‹</button><b>'+MES[vd.getMonth()]+' '+vd.getFullYear()+'</b><button class="btn" id="nx">›</button></div><div class="cal">'+h+'</div>'+pick+
  '<div class="cnt">'+['o','c','f'].map(function(v){return '<span><i class="mini" style="'+egg(v)+'"></i>'+cnt[v]+'</span>'}).join('')+'</div></div>'+
  '<div class="card"><h2>Próximos eventos</h2>'+ev+'</div>'
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function isOn(e){return e&&e.state==='on'}
function devRow(e,label){var dom=e.entity_id.split('.')[0],un=e.state==='unavailable';
  return '<div class="row"><span class="dot '+(un?'al':isOn(e)?'on':'')+'"></span><div class="t"><div class="n">'+esc(label||nm(e))+'</div><div class="s">'+(un?'No disponible':isOn(e)?'Encendido':'Apagado')+'</div></div><button class="sw '+(isOn(e)?'on':'')+'" data-tg="'+e.entity_id+'" '+(un?'disabled style="opacity:.4"':'')+'></button></div>'}
function casaHTML(){
  var h='<h1>Casa</h1><div class="sub">Dispositivos del hub</div>';
  var on=find(/Energ[ií]a PC.*ON/i,['scene','script','button']),off=find(/Energ[ií]a PC.*OFF/i,['scene','script','button']);
  var w1=find(/work\s?station\s?1/i,['switch']),w2=find(/work\s?station\s?2/i,['switch']);
  h+='<div class="card"><h2>Estación de trabajo</h2>';
  if(w1[0]&&w2[0]){h+='<div class="row"><div class="t"><div class="n">Torre</div><div class="s">'+(isOn(w1[0])?'Encendida':'Apagada')+'</div></div></div><div class="row"><div class="t"><div class="n">Pantallas y accesorios</div><div class="s">'+(isOn(w2[0])?'Encendidas':'Apagadas')+'</div></div></div>'}
  h+='<div style="display:flex;gap:8px;margin-top:10px">'+(on[0]?'<button class="btn p" style="flex:1" data-sc="'+on[0].entity_id+'">Encender estación</button>':'')+(off[0]?'<button class="btn w" style="flex:1" data-sc="'+off[0].entity_id+'" data-conf="1">Apagar estación</button>':'')+'</div>'+
  (on[0]||off[0]?'':'<div class="s" style="font-size:12px;color:var(--dim)">No encontré las rutinas "Energía PC" en HA.</div>')+
  '<div class="s" style="font-size:11.5px;color:var(--dim);margin-top:8px">Apagar corta primero las pantallas y la torre tras 1 min. Cierra Windows antes.</div></div>';
  var plugs=find(/Estaci[oó]n de carga|Ventilador/i,['switch','light']);
  h+='<div class="card"><h2>Enchufes</h2>'+(plugs.map(function(e){return devRow(e)}).join('')||'<div style="font-size:12px;color:var(--dim)">Sin enchufes</div>')+'</div>';
  var lights=find(/^Luz/i,['switch','light']).concat(find(/Luz Ba[ñn]o/i,['switch','light']));var seen={};lights=lights.filter(function(e){if(seen[e.entity_id])return false;seen[e.entity_id]=1;return true});
  h+='<div class="card"><h2>Luces</h2>'+(lights.map(function(e){return devRow(e)}).join('')||'<div style="font-size:12px;color:var(--dim)">Sin luces</div>')+'</div>';
  var pu=find(/Puerta balc[oó]n/i,['binary_sensor']),bt=find(/Puerta balc[oó]n.*bater/i,['sensor']);
  h+='<div class="card"><h2>Puerta balcón</h2>'+(pu[0]?'<div class="row"><span class="dot '+(pu[0].state==='unavailable'?'al':pu[0].state==='on'?'on':'')+'"></span><div class="t"><div class="n">'+(pu[0].state==='on'?'Abierta':pu[0].state==='off'?'Cerrada':'No disponible')+'</div>'+(bt[0]&&!isNaN(parseFloat(bt[0].state))?'<div class="s">Batería '+esc(bt[0].state)+'%</div>':'<div class="s">Revisa la pila o el Wi-Fi del sensor</div>')+'</div></div>':'<div style="font-size:12px;color:var(--dim)">Sin sensor</div>')+'</div>';
  return h;
}
function bartoloHTML(){
  var v=find(/bartolo/i,['vacuum'])[0],h='<h1>Bartolo</h1><div class="sub">BPMIO B12</div>';
  if(!v)return h+'<div class="card">No encontré la aspiradora en HA.</div>';
  var A=v.attributes||{},bat=find(/bartolo.*bater|bater.*bartolo/i,['sensor'])[0];
  var stMap={cleaning:'Limpiando',docked:'En la base',returning:'Volviendo',paused:'En pausa',idle:'Inactivo',error:'Error',unavailable:'No disponible'};
  h+='<div class="card"><div class="big">'+(stMap[v.state]||v.state)+'</div><div class="s" style="color:var(--dim);font-size:12px">Batería '+(A.battery_level!=null?A.battery_level:bat?bat.state:'—')+'%</div>'+
  '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn p" style="flex:1" data-vc="start">Limpiar</button><button class="btn" style="flex:1" data-vc="pause">Pausa</button><button class="btn" style="flex:1" data-vc="return_to_base">Base</button></div>'+
  '<div style="margin-top:8px"><button class="btn" data-vc="locate" style="width:100%">Localizar</button></div></div>';
  var st=find(/bartolo|tiempo|veces|vida [uú]til|[aá]rea/i,['sensor']).filter(function(e){return e.state!=='unavailable'});
  h+='<div class="card"><h2>Estado</h2>'+(st.map(function(e){var u=(e.attributes&&e.attributes.unit_of_measurement)||'';var n=parseFloat(e.state),val=isNaN(n)?e.state:(Math.round(n*10)/10).toLocaleString('es-CO'),low=/vida [uú]til/i.test(nm(e))&&n===0;return '<div class="stat"><span>'+esc(nm(e).replace(/^bartolo\s*/i,''))+'</span><span'+(low?' style="color:var(--bad)"':'')+'>'+esc(val)+' '+u+(low?' · reemplazar':'')+'</span></div>'}).join('')||'<div style="font-size:12px;color:var(--dim)">Sin datos</div>')+'</div>';
  return h;
}
function bind(){
  var q=function(s,f){[].forEach.call(document.querySelectorAll(s),f)};
  q('.cell',function(b){b.onclick=function(){S.sel=S.sel===b.dataset.d?'':b.dataset.d;render()}});
  q('.pick button',function(b){b.onclick=function(){var v=b.dataset.v;if(v==='x')delete S.dl[S.sel];else S.dl[S.sel]=v;S.sel='';saveDl();render()}});
  var pv=$('#pv'),nx=$('#nx');if(pv){pv.onclick=function(){S.cm--;render()};nx.onclick=function(){S.cm++;render()}}
  q('[data-tg]',function(b){b.onclick=function(){var id=b.dataset.tg;call(id.split('.')[0],'toggle',{},{entity_id:id})}});
  q('[data-sc]',function(b){b.onclick=function(){if(b.dataset.conf&&!confirm('Esto apaga las pantallas y, en 1 minuto, la torre. ¿Cerraste Windows?'))return;var id=b.dataset.sc,d=id.split('.')[0];call(d,d==='script'?'turn_on':d==='button'?'press':'turn_on',{},{entity_id:id})}});
  q('[data-vc]',function(b){b.onclick=function(){var v=find(/bartolo/i,['vacuum'])[0];if(v)call('vacuum',b.dataset.vc,{},{entity_id:v.entity_id})}});
}
if('serviceWorker' in navigator&&false)navigator.serviceWorker.register('sw.js');
render();connect();
})();
