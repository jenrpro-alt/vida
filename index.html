.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text-secondary);flex-shrink:0}.chk.d{background:var(--active-fill);border-color:var(--active-fill)}
.done .n{text-decoration:line-through;color:var(--text-secondary)}
.mapw{position:relative;width:100%;margin:0 auto;overflow:hidden;border-radius:var(--radius-card-md);background:rgba(10,6,5,.55)}
.hint{font-size:14px;line-height:18px;color:var(--text-secondary)}
.hgrid,.hcol{display:flex;flex-direction:column;gap:var(--space-3)}
.ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:conic-gradient(var(--active-fill) calc(var(--p)*1%),var(--glass-fill) 0)}
.ring>div{width:78px;height:78px;border-radius:50%;background:var(--bg-ember-900);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:26px;font-weight:400}.ring small{font-size:12px;line-height:14px;color:var(--text-secondary)}
.hero{flex-direction:row;align-items:center;gap:var(--space-4);border-radius:var(--radius-card-lg);padding:var(--space-6)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--active-fill);outline-offset:2px}
@media(min-width:900px){
 main{max-width:1240px;padding:var(--space-8) var(--space-8) var(--space-8) 236px}
 .dock{left:16px;top:16px;bottom:16px;transform:none;width:196px;max-width:none;height:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:var(--space-5) var(--space-2);gap:6px;border-radius:var(--radius-card-lg)}
 .dock button{flex:none;height:48px;justify-content:flex-start;padding:0 var(--space-4);gap:12px;font-size:15px}
 .dock button span,.dock button.on span{display:inline}
 .hgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--space-4);align-items:start}
 .tiles{grid-template-columns:repeat(2,1fr)}
 .status{right:22px}
}
@media(min-width:900px){.dhg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--space-4);align-items:start}.dhg .scenes{grid-column:2;grid-row:1}.dhg .dhmap{grid-column:2;grid-row:2}.dhg .panel{grid-column:1;grid-row:1/3}}
@media(min-width:1300px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1500px){main{zoom:1.22}.dock{zoom:1.22}.status{zoom:1.22}}

function optL(o){var k=String(o).toLowerCase().replace(/[\s-]+/g,'_');return OPT[k]||String(o).replace(/_/g,' ').replace(/^./,function(c){return c.toUpperCase()})}
function loadBdev(){
  if(S.bdev!==undefined||S.bdevBusy||!S.ready)return;var v=find(/bartolo/i,['vacuum'])[0];if(!v)return;S.bdevBusy=true;
  send({type:'config/entity_registry/list'},function(r){S.bdevBusy=false;
    if(!r.success){S.bdev=null;S.bdevErr=1;render();return}
    var reg=r.result||[],me=reg.filter(function(x){return x.entity_id===v.entity_id})[0],did=me&&me.device_id;
    var same=did?reg.filter(function(x){return x.device_id===did&&x.entity_id!==v.entity_id}):[];
    S.bdev=same.filter(function(x){return !x.disabled_by}).map(function(x){return x.entity_id});
    S.bdevOff=same.filter(function(x){return x.disabled_by}).length;render()})}
function bdevStates(dom){return (S.bdev||[]).map(function(id){return S.states[id]}).filter(function(e){return e&&(!dom||e.entity_id.split('.')[0]===dom)})}
function bartoloDiag(){
  var v=find(/bartolo/i,['vacuum'])[0],out={vacuum:v?{id:v.entity_id,state:v.state,attributes:v.attributes}:null,dispositivo:bdevStates().map(function(e){return{id:e.entity_id,state:e.state,attributes:e.attributes}}),deshabilitadas:S.bdevOff||0,registro:S.bdevErr?'sin acceso':'ok'};
  var t=JSON.stringify(out,null,1);modalShell('<div class="tt" style="font-size:24px;line-height:28px">Diagnóstico de Bartolo</div><div class="hint">Copia este texto y pégamelo en el chat.</div><textarea id="dg" readonly style="width:100%;height:240px;font-size:12px">'+esc(t)+'</textarea><div class="acts"><button class="btn p" id="dg_c">Copiar</button><button class="btn" id="dg_x">Cerrar</button></div>');
  $('#dg_x').onclick=closeModal;$('#dg_c').onclick=function(){var ta=$('#dg');ta.focus();ta.select();try{document.execCommand('copy');$('#dg_c').textContent='Copiado'}catch(x){}}}
SCREENS.bartolo=function(){
  var b=bartoloInfo(),h=hdr('Bartolo',b?(STM[b.st]||b.st)+(b.bat!=null?' · '+b.bat+' %':''):'BPMIG B12');
  if(!b)return h+card('','<div class="empty">No encontré la aspiradora en Home Assistant.</div>');
  loadBdev();
  var A=b.e.attributes||{};
  if(b.st==='unavailable')h+=card('Sin conexión','<div class="hint">Bartolo no responde. Revisa que Tuya siga conectado en Home Assistant.</div>').replace('class="card"','class="card alertb"');
  h+=card('Control','<div class="stats"><div><b style="color:var(--ok)">'+(b.bat!=null?b.bat+' %':'—')+'</b><span>Batería</span></div><div><b>'+esc(STM[b.st]||b.st)+'</b><span>Estado</span></div></div>'+(b.bat!=null?'<div class="bar"><i style="width:'+b.bat+'%"></i></div>':'')+chips(['<button class="btn p" data-vc="start">Iniciar</button>','<button class="btn" data-vc="pause">Pausa</button>','<button class="btn" data-vc="return_to_base">A la base</button>','<button class="btn" data-vc="locate">Ubicar</button>']));
  if(A.fan_speed_list&&A.fan_speed_list.length)h+=card('Succión',chips(A.fan_speed_list.map(function(x){return chip(esc(optL(x)),String(A.fan_speed).toLowerCase()===String(x).toLowerCase(),'data-fan="'+esc(x)+'"')})));
  // mapa si existe una entidad image/camera del dispositivo
  var mp=bdevStates('image').concat(bdevStates('camera')).filter(function(e){return e.attributes&&e.attributes.entity_picture})[0];
  if(mp)h+=card('Mapa','<img class="bmap" src="'+esc(S.base+mp.attributes.entity_picture)+'" alt="" draggable="false" style="width:100%;border-radius:var(--radius-card-md)">');
  // selectores (nivel de agua, modo de trabajo, etc.)
  bdevStates('select').forEach(function(e){var o=(e.attributes&&e.attributes.options)||[];h+=card(btn(e),chips(o.map(function(x){return chip(esc(optL(x)),e.state===x,'data-sel="'+esc(e.entity_id)+'" data-opt="'+esc(x)+'"')})))});
  // interruptores y números
  var sw=bdevStates('switch'),nu=bdevStates('number'),bt=bdevStates('button');
  if(sw.length||nu.length)h+=card('Ajustes',tiles(sw.map(function(e){return row({ic:IC.robot,t:esc(btn(e)),r:'<span class="'+(e.state==='on'?'on-t':'off-t')+'">'+(e.state==='on'?'Activado':e.state==='off'?'Apagado':'No disponible')+'</span>',at:'data-tg="'+e.entity_id+'"'})}).concat(nu.map(function(e){var u=(e.attributes&&e.attributes.unit_of_measurement)||'';return row({ic:IC.robot,t:esc(btn(e)),r:'<span class="off-t">'+esc(e.state)+' '+esc(u)+'</span>',at:'data-num="'+e.entity_id+'"'})}))));
  if(bt.length)h+=card('Acciones',chips(bt.map(function(e){var rs=/reset|restabl|reinic/i.test(nm(e));return '<button class="btn" data-sc="'+e.entity_id+'"'+(rs?' data-conf="Se restablecerá: '+esc(btn(e))+'"':'')+'>'+esc(btn(e))+'</button>'})));
  // sensores: repuestos e historial (por nombre o por dispositivo)
  var seen={},st=find(/bartolo|tiempo|veces|vida [uú]til|[aá]rea/i,['sensor']).concat(bdevStates('sensor')).filter(function(e){if(seen[e.entity_id]||e.state==='unavailable')return false;seen[e.entity_id]=1;return true});
  var cons=st.filter(function(e){return /vida [uú]til|brush|cepillo|filter|filtro|mop|trapo/i.test(nm(e))&&!/bater/i.test(nm(e))}),oth=st.filter(function(e){return cons.indexOf(e)<0&&!/bater/i.test(nm(e))});
  var fmt=function(e){var u=(e.attributes&&e.attributes.unit_of_measurement)||'',n=parseFloat(e.state);return (isNaN(n)?e.state:(Math.round(n*10)/10).toLocaleString('es-CO'))+' '+u};
  if(cons.length)h+=card('Repuestos',tiles(cons.map(function(e){var n=parseFloat(e.state),low=n===0;return row({ic:IC.robot,icc:low?'var(--bad)':'',t:esc(btn(e).replace(/vida [uú]til (de |del )?(la )?/i,'').replace(/^./,function(c){return c.toUpperCase()})),s:'Vida útil restante',r:'<span class="'+(low?'bad-t':'off-t')+'">'+(low?'Reemplazar':esc(fmt(e)))+'</span>'})})));
  if(oth.length)h+=card('Última limpieza e historial',tiles(oth.map(function(e){return row({ic:IC.robot,t:esc(btn(e)),r:'<span class="off-t">'+esc(fmt(e))+'</span>'})})));
  h+=card('Solo en la app Tuya','<div class="hint">Home Assistant no expone, por ahora, el mapa por zonas, la limpieza por habitación o zona, las paredes virtuales, la edición del mapa ni los temporizadores de Bartolo. Siguen en la app Tuya Smart.'+(S.bdevOff?' Hay '+S.bdevOff+' entidades deshabilitadas de este aparato en Home Assistant: actívalas en Configuración → Dispositivos → Bartolo para que aparezcan aquí.':'')+'</div><button class="btn f" id="bdiag">Diagnóstico</button>');
  return h;
};

function modScreen(cat){return function(){

  if(cat==='med'&&!S.unlocked)return h+card('Salud','<div class="hint">'+(S.D.pin?'Ingresa tu PIN para ver esta sección.':'Crea un PIN de 4 a 6 dígitos para proteger esta sección.')+'</div><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN"><button class="btn p f" id="pgo">'+(S.D.pin?'Entrar':'Crear PIN')+'</button>');
  var list=itemsOf(cat),sub='';
  if(cat==='sub'&&list.length){var nx=list[0];sub=pl(list.length,'activa','activas')+' · próxima: '+nx.name}
  h=hdr(C.n,sub);
  var st='';
  if(cat==='barb'&&list[0]){var d=dleft(list[0].date);st='<div class="stats"><div><b>'+(d<=0?'Ya toca':d+' d')+'</b><span>Próximo corte</span></div><div><b>'+(list[0].ev||21)+' d</b><span>Cada</span></div></div>'}
  if(cat==='sub')st='<div class="stats"><div><b>'+list.length+'</b><span>Activas</span></div><div><b style="color:'+(list.filter(function(i){return dleft(i.date)<=7}).length?'var(--warn)':'var(--text)')+'">'+list.filter(function(i){return dleft(i.date)<=7}).length+'</b><span>Vencen en 7 días</span></div></div>';
  if(st)h+=card('',st);
  var mk=function(it){return row({ic:IC[C.ic],t:esc(it.name),s:(it.where?esc(it.where)+' · ':'')+new Date(it.date+'T00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})+(it.ev?' · '+(REP.filter(function(r){return r[0]===it.ev})[0]||[0,'cada '+it.ev+' d'])[1].toLowerCase():''),r:itemBadge(it),at:'data-it="'+it.id+'"'})};
  h+=list.length?rangeCards(list,mk):card(C.n,'<div class="empty">Nada registrado.</div>');
  h+='<button class="btn p f" data-add="'+cat+'">+ Agregar</button>';
  if(cat==='med')h+='<button class="btn f" id="plock">Bloquear sección</button>';
  return h};}

SCREENS.moto=function(){
  var M=S.D.moto||MOTO0,C=CATS.moto,list=itemsOf('moto'),c=motoCalc(M);
  var h=hdr('Moto','TVS Apache RTR 160 4V');
  h+='<div class="card" style="border-radius:var(--radius-card-lg);padding:var(--space-6);position:relative;overflow:visible;min-height:230px;margin-bottom:var(--space-6)"><div class="disp" style="font-size:32px;line-height:36px;max-width:60%">Apache RTR 160</div><div style="display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)"><div><div class="lab">Odómetro</div><div style="font-size:24px;line-height:28px">'+M.odo.toLocaleString('es-CO')+' km</div></div><div><div class="lab">Gasolina (estimada)</div><div style="font-size:24px;line-height:28px">'+c.pct+' %</div></div></div><img src="'+MOTO_IMG+'" alt="" draggable="false" style="position:absolute;right:-20px;bottom:-28px;width:68%;max-width:360px;filter:drop-shadow(0 30px 24px rgba(0,0,0,.55));pointer-events:none"><span class="go circ s" style="position:absolute;top:var(--space-4);right:var(--space-4)">'+ic('M7 17L17 7M9 7h8v8',18)+'</span></div>';
  var rowsM=[row({ic:IC.fuel,t:'Tanque',s:'Trip 1 · '+M.tripFuel+' km desde el último tanqueo',r:'<span class="'+(c.fuelLeft<=60?'bad-t':'off-t')+'">'+(c.fuelLeft<=0?'Tanquear':'~'+c.fuelLeft+' km')+'</span>'}),
         row({ic:IC.fuel,t:'Cambio de aceite',s:'Trip 2 · '+M.tripOil+' km · cada '+M.oilEvery+' km',r:'<span class="'+(c.oilLeft<=300?'bad-t':'off-t')+'">'+(c.oilLeft<=0?'Ya toca':'en '+c.oilLeft+' km')+'</span>'}),
         row({ic:IC.cal,t:'Lavado',s:'Cada '+M.washEvery+' días',r:'<span class="'+(c.wash<=0?'bad-t':'off-t')+'">'+(c.wash<=0?'Ya toca':'en '+c.wash+' d')+'</span>'})];
  if(c.chain!=null)rowsM.splice(2,0,row({ic:IC.moto,t:'Kit de arrastre',s:'Lubricar cada '+M.chainEvery+' km',r:'<span class="'+(c.chain<=100?'bad-t':'off-t')+'">'+(c.chain<=0?'Ya toca':'en '+c.chain+' km')+'</span>'}));
  if(c.kmL)rowsM.push(row({ic:IC.fuel,t:'Rendimiento real',s:'Promedio de tus últimos tanqueos',r:'<span class="on-t">'+c.kmL.toFixed(1)+' km/L</span>'}));
  h+=card('Mantenimiento','<div class="bar"><i style="width:'+c.pct+'%"></i></div>'+tiles(rowsM)+chips(['<button class="btn p" id="mo_t">Registrar tanqueo</button>','<button class="btn" id="mo_o">Cambié el aceite</button>','<button class="btn" id="mo_e">Ajustar datos</button>']));
  var live=S.states[MH.odo]?'Sincronizado con tu app TVS':'Esperando datos de tu app TVS';
  h+=card('Conexión con tu app TVS','<div class="hint">'+live+'. Tu app puede enviar el odómetro (y los trips) a Home Assistant: entidades <b>input_number.moto_odo</b>, <b>moto_trip_gasolina</b> y <b>moto_trip_aceite</b>. Si solo llega el odómetro, Vida suma los km a los trips y calcula el gasto real.</div>');
  var mkm=function(it){return row({ic:IC.moto,t:esc(it.name)+(it.demo?' <span class="badge">ejemplo</span>':''),s:new Date(it.date+'T00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}),r:itemBadge(it),at:'data-it="'+it.id+'"'})};
  h+=list.length?rangeCards(list,mkm):card('Documentos y fechas','<div class="empty">Nada registrado.</div>');
  h+='<button class="btn p f" data-add="moto">+ Agregar</button>';
  return h};
function openMoto(){
  var M=S.D.moto,F=[['odo','Odómetro (km)'],['tripFuel','Trip 1 · gasolina (km)'],['tripOil','Trip 2 · aceite (km)'],['range','Autonomía de un tanque (km)'],['oilEvery','Cambio de aceite cada (km)'],['chainAt','Último lubricado de cadena (km del odómetro, 0 = no usar)'],['chainEvery','Cadena cada (km, 0 = no usar)'],['washEvery','Lavar cada (días)']];
  modalShell('<div class="tt" style="font-size:24px;line-height:28px">Datos de la moto</div>'+F.map(function(f){return '<label>'+f[1]+'</label><input id="mo_'+f[0]+'" type="number" inputmode="numeric" value="'+M[f[0]]+'">'}).join('')+'<label>Último lavado</label><input id="mo_washLast" type="date" value="'+M.washLast+'"><div class="acts"><button class="btn p" id="mo_s">Guardar</button><button class="btn" id="mo_x">Cerrar</button></div>');
  $('#mo_x').onclick=closeModal;
  $('#mo_s').onclick=function(){F.forEach(function(f){var v=parseFloat($('#mo_'+f[0]).value);if(!isNaN(v))M[f[0]]=Math.max(0,v)});M.range=Math.max(50,M.range);M.lastOdo=M.odo;M.washLast=$('#mo_washLast').value||M.washLast;M.adj=1;saveD();pushMoto();closeModal()}}
function openTanqueo(){
  var M=S.D.moto;modalShell('<div class="tt" style="font-size:24px;line-height:28px">Registrar tanqueo</div><div class="hint">Tu Trip 1 marca '+M.tripFuel+' km. Con los litros que echaste, Vida calcula tu rendimiento real.</div><label>Litros</label><input id="tq_l" type="number" inputmode="decimal" step="0.01" placeholder="Ej. 7.5"><div class="acts"><button class="btn p" id="tq_s">Guardar</button><button class="btn" id="tq_x">Cerrar</button></div>');
  $('#tq_x').onclick=closeModal;
  $('#tq_s').onclick=function(){var l=parseFloat($('#tq_l').value);if(!(l>0))return;M.fills=M.fills||[];if(M.tripFuel>0)M.fills.push({odo:M.odo,l:l,kmL:M.tripFuel/l,d:key(today())});M.fills=M.fills.slice(-30);M.tripFuel=0;saveD();pushMoto();closeModal()}}
// ---------- Pendientes
function tuyaDown(){var d=mapDevs().filter(function(x){return /Tuya/.test(x.kind)}),b=find(/bartolo/i,['vacuum'])[0];if(!d.length&&!b)return false;return d.every(function(x){return x.un})&&(!b||b.state==='unavailable')}
function pendList(){
  var devs=mapDevs(),un=devs.filter(function(d){return d.un}),demo=S.D.items.filter(function(i){return i.demo}).length;
  var P=[
   [!tuyaDown(),'Tuya se desconectó','En Home Assistant: Configuración → Dispositivos y servicios → Tuya → Reconfigurar, y escanea el QR con la app Tuya Smart / Smart Life','pend'],
   [S.ready,'Conexión con Home Assistant','Conectado',null],
   [S.cals.length>0,'Calendarios','Conecta Google Calendar en HA','casa'],
   [!un.length,'Dispositivos Tuya sin señal',un.length?un.map(function(d){return d.name}).join(', ')+': revisa la app Tuya':'Todos responden','casa'],
   [!find(/bartolo.*vida [uú]til/i,['sensor']).some(function(e){return parseFloat(e.state)===0}),'Repuestos de Bartolo','Filtro, cepillo o gamuza en 0 h: reemplazar y reiniciar contador en la app Tuya','bartolo'],
   [!!S.D.pin,'PIN de Salud','Crea tu PIN','med'],
   [demo===0,'Datos de ejemplo','Tienes '+demo+' registros de ejemplo: ajústalos con tus fechas reales','menu'],
   [!!S.states[MH.odo],'App TVS conectada','Tu app envía el odómetro a Home Assistant (input_number.moto_odo)','moto'],
   [Object.keys(S.dl||{}).length>3,'Bitácora','Marca tus días de oficina, casa y finde','home'],
   [(S.D.closet||[]).length>0,'Closet','Agrega tus prendas','closet'],
   [false,'Fraat','Necesita un endpoint que envíe datos a Vida','fraat'],
   [false,'Gato Lio real','Falta el archivo .glb (por ahora hay un gato aleatorio en el mapa)','casa'],
   [false,'Typhur, CareCam, Samsung Health','Integraciones aún sin conectar a HA','ajustes']];
  return P}
function pendCard(small){
  var P=pendList(),todo=P.filter(function(p){return !p[0]});
  if(small)return card('Lo que falta · '+todo.length,tiles(todo.slice(0,4).map(function(p){return row({dot:'',t:esc(p[1]),s:esc(p[2]),at:'data-go="'+(p[3]||'pend')+'"'})}))+'<button class="btn f" data-go="pend">Ver todo</button>');
  return card('Por completar · '+todo.length,tiles(todo.map(function(p){return row({dot:'',t:esc(p[1]),s:esc(p[2]),at:p[3]?'data-go="'+p[3]+'"':''})})))+(P.length-todo.length?card('Listo · '+(P.length-todo.length),tiles(P.filter(function(p){return p[0]}).map(function(p){return row({dot:'on',t:esc(p[1]),s:esc(p[2])})}))):'')}
SCREENS.pend=function(){return hdr('Lo que falta','Para que Vida quede completa')+pendCard(false)};

SCREENS.ajustes=function(){
  var h=hdr('Ajustes','Vida en este dispositivo');
  h+=card('Perfil','<label class="hint">Tu nombre</label><input id="a_name" value="'+esc(S.D.name||'Juan')+'"><button class="btn f" id="a_ns">Guardar nombre</button>');

  var ad=$('#a_demo');if(ad)ad.onclick=function(){if(confirm('¿Borrar los registros de ejemplo?')){S.D.items=S.D.items.filter(function(i){return !i.demo});saveD();render()}};
  var lo=$('#logout');if(lo)lo.onclick=function(){if(confirm('¿Desconectar este dispositivo?')){localStorage.removeItem('vida-token');location.reload()}};
}
setInterval(function(){if(S.scr==='home'&&S.tok)softRender()},30000);
render();connect();
})();
</script>
